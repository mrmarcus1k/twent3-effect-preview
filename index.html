/* ── AI Depth Map — powered by Depth Anything v2 (transformers.js) ────
   Runs entirely in the browser via ONNX/WebAssembly.
   First use downloads ~30 MB model (cached permanently after that).
   Output: white = near, black = far (matches sculptok.com convention).  */

async function generateDepthMap(imageDataUrl) {
  const statusEl = document.getElementById('depthStatus');
  const setStatus = t => { if (statusEl) { statusEl.className = 'depth-status'; statusEl.textContent = t; } };

  try {
    /* ── 1. Lazy-load transformers.js (ES module via dynamic import) ── */
    if (!window._depthPipe) {
      setStatus('Loading AI depth model (first use downloads ~30 MB)…');
      let transformers;
      try {
        transformers = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.1.2');
      } catch(e) {
        /* Fallback to older @xenova bundle */
        transformers = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
      }
      const { pipeline, env } = transformers;
      if (env) { env.allowRemoteModels = true; env.allowLocalModels = false; }

      const MODEL = 'onnx-community/depth-anything-v2-small';
      setStatus('Downloading model weights — this only happens once…');
      window._depthPipe = await pipeline('depth-estimation', MODEL, {
        dtype: 'fp32',
        progress_callback: p => {
          if (p.status === 'progress')
            setStatus(`Downloading model: ${Math.round(p.progress || 0)}%`);
          else if (p.status === 'ready')
            setStatus('Model ready — running inference…');
        }
      });
    }

    /* ── 2. Run inference ─────────────────────────────────────────── */
    setStatus('Estimating depth…');
    /* Pipeline accepts a URL string; turn the data URL into an object URL */
    const blob    = await fetch(imageDataUrl).then(r => r.blob());
    const objUrl  = URL.createObjectURL(blob);
    const result  = await window._depthPipe(objUrl);
    URL.revokeObjectURL(objUrl);

    /* ── 3. Extract depth image ────────────────────────────────────
       result.depth  — RawImage (grayscale, uint8, channels 1 or 3)
       Depth Anything v2: high value = close to camera (disparity).
       We render white=near which is already what the model provides.  */
    const depth = result.depth;
    const W = depth.width, H = depth.height;
    const ch  = depth.channels || 1;  /* 1=grayscale, 3=RGB */
    const src = depth.data;           /* Uint8ClampedArray or similar */

    /* ── 4. Convert to greyscale canvas PNG ──────────────────────── */
    const cvs = document.createElement('canvas');
    cvs.width = W; cvs.height = H;
    const ctx  = cvs.getContext('2d');
    const idat = ctx.createImageData(W, H);
    const dst  = idat.data;

    for (let i = 0; i < W * H; i++) {
      const v = src[i * ch];   /* first channel = greyscale value */
      dst[i*4]   = v;
      dst[i*4+1] = v;
      dst[i*4+2] = v;
      dst[i*4+3] = 255;
    }
    ctx.putImageData(idat, 0, 0);
    setStatus('✓ Depth map generated');
    return cvs.toDataURL('image/png');

  } catch(e) {
    console.error('[depth AI]', e);
    setStatus('✗ Depth generation failed: ' + (e.message || e));
    return null;
  }
}

/* ═══════════════════════════════════════════════════════════════
   FRAME SEQUENCE — drop zone + loader + renderer
   ─────────────────────────────────────────────────────────────
   Accepts:  multi-file PNG/JPG drop/select  OR  ZIP archive
   Stores:   S.seqFrames[] = sorted data URLs (max 60 subsampled)
   Renders:  per-frame perspectiveDraw synced to tilt angle
   ═══════════════════════════════════════════════════════════════ */

function buildSeqDropZone() {
  const zonesEl = document.getElementById('uploadZones');
  if (!zonesEl) return;

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="seq-drop" id="seqDrop">
      <span class="seq-drop-icon">🎞️</span>
      <div class="seq-drop-title">Drop your frame sequence here</div>
      <div class="seq-drop-sub">
        Drag all PNGs at once, drag a <strong>folder</strong>,
        or drop a <strong>ZIP archive</strong><br>
        From After Effects: <em>Composition → Add to Render Queue → PNG Sequence</em><br>
        From Triaxes: <em>File → Export Frames</em>
      </div>
      <input type="file" id="seqFileInput" multiple accept="image/*,.zip" style="display:none" />
    </div>
    <div class="seq-progress-bar" id="seqProgressBar" style="display:none">
      <div class="seq-progress-fill" id="seqProgressFill"></div>
    </div>
    <div class="seq-count" id="seqCount" style="display:none"></div>
    <div class="seq-strip" id="seqStrip" style="display:none"></div>`;
  zonesEl.appendChild(div);

  const drop  = document.getElementById('seqDrop');
  const input = document.getElementById('seqFileInput');

  drop.addEventListener('click',     ()  => input.click());
  drop.addEventListener('dragover',  e   => { e.preventDefault(); drop.classList.add('drag-over'); });
  drop.addEventListener('dragleave', ()  => drop.classList.remove('drag-over'));
  drop.addEventListener('drop',      e   => {
    e.preventDefault(); drop.classList.remove('drag-over');
    loadSeqFromDrop(e.dataTransfer);
  });
  input.addEventListener('change',   e   => loadSeqFromFiles([...e.target.files]));
}

async function loadSeqFromDrop(dt) {
  /* Support folder drop via FileSystemEntry API */
  const items = [...(dt.items || [])];
  const files = [];

  for (const item of items) {
    if (item.kind !== 'file') continue;
    const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
    if (entry && entry.isDirectory) {
      await readDirEntry(entry, files);
    } else {
      const f = item.getAsFile();
      if (f) files.push(f);
    }
  }
  if (files.length === 0) return;

  /* Single ZIP — extract it */
  if (files.length === 1 && files[0].name.toLowerCase().endsWith('.zip')) {
    await loadSeqFromZip(files[0]);
    return;
  }
  await loadSeqFromFiles(files);
}

function readDirEntry(dirEntry, out) {
  return new Promise(resolve => {
    const reader = dirEntry.createReader();
    const readBatch = () => {
      reader.readEntries(async entries => {
        if (!entries.length) { resolve(); return; }
        for (const e of entries) {
          if (e.isFile && /\.(png|jpe?g|webp)$/i.test(e.name)) {
            await new Promise(r => e.file(f => { out.push(f); r(); }));
          } else if (e.isDirectory) {
            await readDirEntry(e, out);
          }
        }
        readBatch();
      });
    };
    readBatch();
  });
}

async function loadSeqFromZip(zipFile) {
  setSeqStatus('Extracting ZIP…', 0);
  try {
    const JSZip = window.JSZip;
    if (!JSZip) { setSeqStatus('JSZip not loaded — refresh and try again.', -1); return; }
    const zip    = await JSZip.loadAsync(zipFile);
    const names  = Object.keys(zip.files)
      .filter(n => /\.(png|jpe?g|webp)$/i.test(n) && !zip.files[n].dir)
      .sort();

    const blobs = [];
    for (let i = 0; i < names.length; i++) {
      const blob = await zip.files[names[i]].async('blob');
      blobs.push(new File([blob], names[i], { type: 'image/png' }));
      setSeqStatus(`Extracting… ${i+1}/${names.length}`, (i+1)/names.length);
    }
    await loadSeqFromFiles(blobs);
  } catch(e) {
    setSeqStatus('ZIP error: ' + e.message, -1);
  }
}

async function loadSeqFromFiles(files) {
  /* Filter to images, sort by filename */
  const imgFiles = files
    .filter(f => /\.(png|jpe?g|webp)$/i.test(f.name))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

  if (!imgFiles.length) {
    setSeqStatus('No image files found. Drop PNG/JPG files or a ZIP.', -1);
    return;
  }

  /* Subsample to max 60 frames for performance */
  const MAX_FRAMES = 60;
  const step = imgFiles.length > MAX_FRAMES
    ? imgFiles.length / MAX_FRAMES
    : 1;
  const picked = [];
  for (let i = 0; i < imgFiles.length; i += step) {
    picked.push(imgFiles[Math.round(i)]);
    if (picked.length >= MAX_FRAMES) break;
  }

  setSeqStatus(`Loading ${picked.length} frames…`, 0);
  const dataURLs = [];
  for (let i = 0; i < picked.length; i++) {
    dataURLs.push(await fileToDataURL(picked[i]));
    setSeqStatus(`Loading… ${i+1}/${picked.length}`, (i+1)/picked.length);
  }

  S.seqFrames = dataURLs;
  showSeqStrip(dataURLs, imgFiles.length);
  checkReady();

  const msg = imgFiles.length > MAX_FRAMES
    ? `✓ ${dataURLs.length} frames loaded (subsampled from ${imgFiles.length})`
    : `✓ ${dataURLs.length} frames loaded`;
  setSeqStatus(msg, 1);
}

function fileToDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = e => res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function setSeqStatus(msg, progress) {
  const count = document.getElementById('seqCount');
  const bar   = document.getElementById('seqProgressBar');
  const fill  = document.getElementById('seqProgressFill');
  if (count) { count.style.display = 'block'; count.textContent = msg; }
  if (bar && progress >= 0 && progress <= 1) {
    bar.style.display = 'block';
    if (fill) fill.style.width = (progress * 100).toFixed(1) + '%';
  } else if (bar) {
    bar.style.display = 'none';
  }
}

function showSeqStrip(dataURLs, total) {
  const strip = document.getElementById('seqStrip');
  const drop  = document.getElementById('seqDrop');
  if (!strip || !drop) return;
  drop.classList.add('has-frames');
  drop.querySelector('.seq-drop-title').textContent = total + ' frames loaded';

  strip.style.display = 'flex';
  strip.innerHTML = '';
  /* Show max 20 thumbnails in strip */
  const step = Math.max(1, Math.ceil(dataURLs.length / 20));
  for (let i = 0; i < dataURLs.length; i += step) {
    const img = document.createElement('img');
    img.src = dataURLs[i];
    strip.appendChild(img);
  }
}

/* ── Render: Frame Sequence ────────────────────────────────────── */
function renderSequence(cc) {
  cc.innerHTML = '';
  const frames = S.seqFrames;
  const N      = frames.length;
  if (!N) return;

  /* Pre-load all frames as decoded Image elements (GPU-cached). */
  const { CW: MW, CH: MH } = cardSrcDims();
  const imgEls = frames.map(src => { const img = new Image(); img.src = src; return img; });
  const offCvs = document.createElement('canvas'); offCvs.width = MW; offCvs.height = MH;
  const offCtx = offCvs.getContext('2d');

  let _fi = 0, paused = false;
  S.frameFn = (now, tilt) => {
    /* tilt −1…+1 → frame 0…N−1, smoothed so it scrubs cleanly */
    const rawT  = (tilt + 1) / 2;
    const lensT = rawT * rawT * (3 - 2 * rawT);
    if (!paused) _fi += (lensT * (N - 1) - _fi) * 0.12;
    const fi = Math.max(0, Math.min(N - 1, Math.round(_fi)));
    const img = imgEls[fi];
    if (!img || !img.complete || img.naturalWidth === 0) return null;
    offCtx.clearRect(0, 0, MW, MH);
    drawCover(offCtx, img, MW, MH);
    return offCvs;
  };
  addCtrl('Pause', '⏸', () => { paused = !paused; }, false);
}

/* ═══════════════════════════════════════════════════════════════
   SELECT EFFECT
   ═══════════════════════════════════════════════════════════════ */
function selectEffect(i) {
  S.effectIdx = i;
  const eff = EFFECTS[i];
  /* If current orientation not supported by new effect, reset to lr */
  if (!eff.orientations.includes(S.orientation)) S.orientation = 'lr';
  stopHandComposite();
  buildUploadPanel();
  showPlaceholder();

  /* Pre-warm the AI depth model as soon as 3D is selected.
     The model (~30 MB) downloads silently in the background so it's
     cached and ready before the customer uploads their image.
     (Layered 3D no longer uses depth maps — it's PSD-layer planes.)   */
  if (eff.id === 'threed' && !window._depthPipe) {
    import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.1.2')
      .catch(() => import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2'))
      .then(({ pipeline, env }) => {
        if (env) { env.allowRemoteModels = true; env.allowLocalModels = false; }
        return pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', { dtype: 'fp32' });
      })
      .then(pipe => { window._depthPipe = pipe; console.log('[depth] model ready'); })
      .catch(e => console.warn('[depth] pre-warm failed:', e));
  }
}

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
/* Deep-link: ?effect=<id> preselects an effect so product pages can send
   customers straight to the relevant preview (2026-07-04). Accepted ids:
   flip, morph, threed (alias: 3d), layered3d, animation, zoom,
   stereoscopic, sequence. Unknown values fall back to the default.     */
(() => {
  const want = (new URLSearchParams(location.search).get('effect') || '').toLowerCase();
  const id = want === '3d' ? 'threed' : want;
  const idx = EFFECTS.findIndex(e => e.id === id);
  if (idx >= 0) S.effectIdx = idx;
})();
buildUploadPanel();
showPlaceholder();

/* ─── Iframe auto-height (Shopify embed) ──────────────────────────
   Reports content height to the parent page so the embedding iframe
   can size to fit — no inner scrollbar on any device. Harmless when
   the app runs standalone (no parent listener). See handoff / embed
   snippet for the matching parent-side listener.                    */
(() => {
  let last = 0;
  const post = () => {
    const h = document.documentElement.scrollHeight;
    if (Math.abs(h - last) < 2) return;
    last = h;
    try { parent.postMessage({ t3preview_height: h }, '*'); } catch (e) {}
  };
  window.addEventListener('load', post);
  window.addEventListener('resize', post);
  try { new ResizeObserver(post).observe(document.body); } catch (e) {}
  setInterval(post, 1000);
})();
</script>
