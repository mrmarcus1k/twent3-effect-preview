<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Never let the browser hold a stale build: this app is edited live and
       served from a local http.server that does not send cache headers, so
       browsers heuristic-cache the HTML and show old code after edits. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TwenT3 — Product Preview Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <!-- ag-psd: PSD layer parser for Layered 3D / Animation effects.
       LOCAL copy (fixed 2026-07-02): the old CDN URL pointed at a file that
       does not exist in the package (dist/ag-psd.min.js), so AgPsd was
       undefined and every PSD upload failed with the "library is loading"
       alert. Local bundle = ag-psd@27 dist/bundle.js, global `agPsd`.      -->
  <script src="ag-psd.min.js"></script>
  <script>window.AgPsd = window.AgPsd || window.agPsd;</script>
  <!-- face-api.js: 68-point facial landmark detection for morph alignment -->
  <script src="face-api.js"></script>
  <!-- JSZip: read ZIP archives (for frame-sequence ZIP upload) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #52bf90;
      --green-dark: #3a9d73;
      --green-a10:  rgba(82,191,144,.10);
      --green-a20:  rgba(82,191,144,.20);
      --dark:       #0d1117;
      --dark-2:     #161b22;
      --dark-3:     #21262d;
      --dark-4:     #30363d;
      --text:       #e6edf3;
      --muted:      #8b949e;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Header ─────────────────────────────────────────────── */
    .header {
      background: var(--dark-2);
      border-bottom: 1px solid var(--dark-4);
      padding: .85rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .header-logo { font-size: 1.4rem; font-weight: 800; color: var(--green); letter-spacing: -.5px; }
    .header-sep  { color: var(--dark-4); }
    .header-sub  { font-size: .8rem; color: var(--muted); }
    .header-badge {
      margin-left: auto;
      background: var(--green-a10);
      border: 1px solid var(--green-a20);
      color: var(--green);
      font-size: .68rem;
      font-weight: 700;
      padding: .22rem .6rem;
      border-radius: 999px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* ─── Layout ──────────────────────────────────────────────── */
    .main {
      display: grid;
      grid-template-columns: 370px 1fr;
      min-height: calc(100vh - 58px);
    }

    /* ─── Upload Panel ────────────────────────────────────────── */
    .upload-panel {
      border-right: 1px solid var(--dark-4);
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }
    .section-label {
      font-size: .68rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
    }

    /* ─── Effect Selector Grid ────────────────────────────────── */
    .effect-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .45rem;
    }
    .effect-btn {
      background: var(--dark-3);
      border: 1.5px solid var(--dark-4);
      border-radius: .65rem;
      padding: .65rem .35rem .55rem;
      text-align: center;
      cursor: pointer;
      font-family: inherit;
      font-size: .7rem;
      font-weight: 600;
      color: var(--muted);
      transition: all .18s;
      line-height: 1.3;
    }
    .effect-btn:hover  { border-color: var(--green); color: var(--text); background: var(--dark-4); }
    .effect-btn.active { background: var(--green-a10); border-color: var(--green); color: var(--green); }
    .effect-btn .btn-icon { display: block; font-size: 1.3rem; margin-bottom: .3rem; }

    .effect-headline { font-size: 1.15rem; font-weight: 800; }
    .effect-desc     { font-size: .81rem; color: var(--muted); line-height: 1.65; }

    .upload-zone-title { font-size: .74rem; font-weight: 700; color: var(--green); margin-bottom: .4rem; }
    .upload-zone {
      position: relative;
      border: 2px dashed var(--dark-4);
      border-radius: .85rem;
      padding: 1.4rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      background: var(--dark-3);
      margin-bottom: .6rem;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--green);
      background: var(--green-a10);
    }
    .upload-zone input {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .upload-icon       { font-size: 1.8rem; margin-bottom: .4rem; }
    .upload-label-text { font-size: .82rem; color: var(--muted); }
    .upload-label-text strong { color: var(--green); }
    .upload-hint   { font-size: .7rem; color: var(--muted); opacity: .6; margin-top: .25rem; }
    .psd-badge {
      display: inline-block;
      background: rgba(82,191,144,.15);
      border: 1px solid var(--green-a20);
      color: var(--green);
      font-size: .62rem; font-weight: 700;
      padding: .1rem .4rem;
      border-radius: 4px;
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-top: .3rem;
    }

    .thumb-row { display: flex; gap: .65rem; flex-wrap: wrap; }
    .thumb {
      width: 64px; height: 64px;
      border-radius: .45rem; overflow: hidden;
      border: 2px solid var(--green);
      position: relative; flex-shrink: 0;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .rm {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,.75);
      border: none; color: #fff;
      width: 16px; height: 16px;
      border-radius: 50%; font-size: 9px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .info-card {
      background: var(--dark-3);
      border: 1px solid var(--dark-4);
      border-radius: .85rem;
      padding: .9rem 1rem;
    }
    .info-card-title {
      font-size: .76rem; font-weight: 700; color: var(--green);
      display: flex; align-items: center; gap: .35rem; margin-bottom: .4rem;
    }
    .step { display: flex; align-items: flex-start; gap: .65rem; margin-bottom: .4rem; font-size: .76rem; color: var(--muted); }
    .step-num {
      flex-shrink: 0; width: 19px; height: 19px;
      border-radius: 50%; background: var(--dark-4);
      color: var(--green); font-size: .68rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .tip-box {
      border-left: 3px solid var(--green);
      background: var(--dark-3);
      border-radius: 0 .7rem .7rem 0;
      padding: .7rem .9rem;
      font-size: .75rem; color: var(--muted); line-height: 1.6;
    }
    .tip-box strong { color: var(--green); display: block; margin-bottom: .2rem; }
    .btn-generate {
      width: 100%; padding: .85rem;
      background: var(--green); color: #fff; border: none;
      border-radius: .85rem; font-family: inherit;
      font-size: .92rem; font-weight: 700; cursor: pointer;
      transition: background .2s, transform .15s, opacity .2s;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn-generate:hover    { background: var(--green-dark); transform: translateY(-1px); }
    .btn-generate:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    /* ─── Preview Panel ───────────────────────────────────────── */
    .preview-panel {
      display: flex;
      flex-direction: column;
      background: #0a0e14;
      overflow: hidden;
    }

    /* ─── Hand Scene ──────────────────────────────────────────── */
    .hand-scene {
      position: relative;
      flex: 1;
      overflow: hidden;
      min-height: 400px;
    }
    .scene-bg {
      position: absolute; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(120,160,200,.18) 0%, transparent 55%),
        linear-gradient(175deg, #1e2d3d 0%, #0e1820 40%, #070c12 100%);
    }
    .scene-bg::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 35%;
      background: linear-gradient(to top, rgba(82,191,144,.025), transparent);
    }

    /* ── Card content area (behind canvas, z:1) ─────────────── */
    #cardArea {
      position: absolute; z-index: 1;
      overflow: hidden; border-radius: 8px;
    }
    #cardContent {
      width: 100%; height: 100%;
      position: relative; overflow: hidden;
    }

    /* ── Hand video (hidden, feeds canvas) ──────────────────── */
    #handVideo {
      position: absolute; opacity: 0; pointer-events: none;
      top: 0; left: 0; width: 1px; height: 1px;
    }

    /* ── Canvas — chroma-keyed hands (z:2) ──────────────────── */
    #handCanvas {
      position: absolute; inset: 0; z-index: 2;
      width: 100%; height: 100%; display: block;
    }

    /* ── Demo shimmer ────────────────────────────────────────── */
    @keyframes demoGrad {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .demo-card-face {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a3a2a, #0d2018, #52bf90, #0d2018, #1a3a2a);
      background-size: 300% 300%;
      animation: demoGrad 4s ease infinite;
      display: flex; align-items: center; justify-content: center;
    }
    .demo-card-face span {
      font-size: .6rem; font-weight: 700;
      color: rgba(255,255,255,.3);
      letter-spacing: 2px; text-transform: uppercase;
    }

    /* ─── Card tilt — LEFT-RIGHT (rotateY, card_02_03.mp4) ───── */
    :root { --tilt-dur: 3s; }
    @keyframes cardTiltLR {
      0%        { transform: rotateY(-12deg); }
      20%       { transform: rotateY(-4deg);  }
      40%, 60%  { transform: rotateY(10deg);  }
      80%       { transform: rotateY(3deg);   }
      100%      { transform: rotateY(-12deg); }
    }
    .card-tilting {
      animation: cardTiltLR var(--tilt-dur) ease-in-out infinite;
      transform-origin: center center;
      transform-style: preserve-3d;
    }

    /* ─── Card tilt — UP-DOWN (rotateX, card_01_03.mp4) ──────── */
    @keyframes cardTiltUD {
      0%        { transform: rotateX(8deg);  }
      20%       { transform: rotateX(2deg);  }
      40%, 60%  { transform: rotateX(-7deg); }
      80%       { transform: rotateX(-1deg); }
      100%      { transform: rotateX(8deg);  }
    }
    .card-tilting-ud {
      animation: cardTiltUD var(--tilt-dur) ease-in-out infinite;
      transform-origin: center center;
      transform-style: preserve-3d;
    }

    /* ─── 2 Image Flip — canvas-driven lenticular stripe render ─
       renderFlip() uses a canvas + requestAnimationFrame loop.
       Tilt angle AND lenticular stripe progress are both derived
       from handVideoEl.currentTime so hand, tilt, and image
       transition are one perfectly synced continuous movement.
       No CSS animation needed for this effect.                   */

    /* ─── 3D Parallax ────────────────────────────────────────── */
    .threed-wrap {
      position:relative; width:100%; height:100%;
      transform-style:preserve-3d;
    }
    .threed-layer { position:absolute; inset:0; }
    .threed-layer img { width:100%; height:100%; object-fit:cover; display:block; }

    /* ─── Layered 3D depth planes ────────────────────────────── */
    .layer-plane { position:absolute; inset:0; transition: transform .08s ease-out; }
    .layer-plane img,
    .layer-plane canvas { width:100%; height:100%; object-fit:cover; display:block; }

    /* ─── Animation frames ───────────────────────────────────── */
    .anim-frame { position:absolute; inset:0; opacity:0; transition: opacity .12s ease; }
    .anim-frame.active { opacity:1; }
    .anim-frame img,
    .anim-frame canvas { width:100%; height:100%; object-fit:cover; display:block; }

    /* ─── Zoom ───────────────────────────────────────────────── */
    @keyframes zoomPulse {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.45); }
    }
    .zoom-img {
      width:100%; height:100%; object-fit:cover; display:block;
      animation: zoomPulse var(--tilt-dur) ease-in-out infinite;
    }

    /* ─── Preview footer ──────────────────────────────────────── */
    .preview-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
      padding: .75rem 1.5rem .85rem;
      background: var(--dark-2);
      border-top: 1px solid var(--dark-4);
      z-index: 10;
    }
    .preview-effect-name { font-size: .88rem; font-weight: 700; }
    .preview-hint { font-size: .72rem; color: var(--muted); }
    .preview-disclaimer {
      width: 100%;
      margin-top: .4rem;
      font-size: .68rem;
      line-height: 1.45;
      color: var(--muted);
      opacity: .85;
      text-align: center;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Orientation toggle ──────────────────────────────────── */
    .orient-bar {
      display: flex;
      gap: .35rem;
      background: var(--dark-3);
      border: 1px solid var(--dark-4);
      border-radius: .65rem;
      padding: .25rem;
    }
    .orient-btn {
      background: none;
      border: none;
      border-radius: .45rem;
      padding: .32rem .75rem;
      font-family: inherit;
      font-size: .72rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .3rem;
      transition: all .18s;
      white-space: nowrap;
    }
    .orient-btn:hover { color: var(--text); }
    .orient-btn.active {
      background: var(--green);
      color: #fff;
    }

    /* ── Preview controls ────────────────────────────────────── */
    .preview-controls {
      display: flex; gap: .55rem; flex-wrap: wrap; justify-content: center;
    }
    .btn-ctrl {
      background: var(--dark-3); color: var(--muted);
      border: 1px solid var(--dark-4);
      border-radius: .6rem; padding: .42rem .9rem;
      font-size: .73rem; font-weight: 600; cursor: pointer;
      font-family: inherit;
      display: flex; align-items: center; gap: .3rem;
      transition: all .18s;
    }
    .btn-ctrl:hover  { border-color: var(--green); color: var(--green); }
    .btn-ctrl.active { background: var(--green); color: #fff; border-color: var(--green); }

    /* Spinner */
    .spinner {
      width:28px; height:28px;
      border:3px solid var(--dark-4);
      border-top-color: var(--green);
      border-radius:50%;
      animation: spin .8s linear infinite;
      position: absolute; top:50%; left:50%;
      transform: translate(-50%,-50%);
    }
    @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

    /* ─── Depth Map Section ───────────────────────────────────── */
    .depth-section {
      border-top: 1px solid var(--dark-4);
      padding-top: .85rem;
      display: flex; flex-direction: column; gap: .55rem;
    }
    .depth-drop-zone {
      border: 1.5px dashed var(--dark-4);
      border-radius: .65rem;
      padding: .65rem .75rem;
      display: flex; align-items: center; gap: .65rem;
      cursor: pointer;
      background: var(--dark-3);
      transition: border-color .18s;
    }
    .depth-drop-zone:hover, .depth-drop-zone.drag-over {
      border-color: var(--green); background: var(--green-a10);
    }
    .depth-drop-zone.has-map { border-color: var(--green); }
    .depth-drop-icon { font-size: 1.2rem; }
    .depth-drop-text { font-size: .72rem; color: var(--muted); line-height: 1.3; }
    .depth-drop-text strong { color: var(--text); }
    .depth-map-thumb {
      width: 56px; height: 32px; object-fit: cover;
      border-radius: 4px; border: 1px solid var(--dark-4); flex-shrink: 0;
    }
    .depth-api-row {
      display: flex; gap: .45rem; align-items: stretch;
    }
    .depth-api-row .btn-depth-gen { flex: 1; }
    .depth-api-key {
      flex: 1; background: var(--dark-3);
      border: 1.5px solid var(--dark-4); border-radius: .55rem;
      color: var(--text); font-size: .72rem; padding: .42rem .65rem;
      font-family: inherit; outline: none;
    }
    .depth-api-key:focus { border-color: var(--green); }
    .depth-api-key::placeholder { color: var(--muted); }
    .btn-depth-gen {
      background: var(--green-a10); border: 1.5px solid var(--green-a20);
      color: var(--green); border-radius: .55rem;
      padding: .42rem .75rem; font-size: .72rem; font-weight: 700;
      cursor: pointer; font-family: inherit; white-space: nowrap;
      transition: all .18s;
    }
    .btn-depth-gen:hover { background: var(--green); color: #fff; border-color: var(--green); }
    .btn-depth-gen:disabled { opacity: .45; cursor: not-allowed; }
    .depth-status { font-size: .68rem; color: var(--muted); text-align: center; }
    .depth-status.ok { color: var(--green); }
    .depth-status.err { color: #f85149; }

    /* ─── Frame Sequence Drop Zone ────────────────────────────── */
    .seq-drop {
      border: 2px dashed var(--dark-4);
      border-radius: .85rem;
      padding: 1.8rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: var(--dark-3);
      position: relative;
    }
    .seq-drop:hover, .seq-drop.drag-over {
      border-color: var(--green);
      background: var(--green-a10);
    }
    .seq-drop.has-frames { border-color: var(--green); border-style: solid; }
    .seq-drop-icon { font-size: 2rem; display: block; margin-bottom: .45rem; }
    .seq-drop-title { font-size: .88rem; font-weight: 700; color: var(--text); margin-bottom: .2rem; }
    .seq-drop-sub { font-size: .72rem; color: var(--muted); line-height: 1.4; }
    .seq-drop-sub strong { color: var(--green); }
    .seq-strip {
      display: flex; gap: 3px; overflow-x: auto; padding: .5rem 0;
      scrollbar-width: thin; scrollbar-color: var(--dark-4) transparent;
    }
    .seq-strip img {
      height: 36px; width: auto; border-radius: 3px; flex-shrink: 0;
      border: 1px solid var(--dark-4);
    }
    .seq-count {
      font-size: .7rem; color: var(--green); font-weight: 700;
      text-align: center; padding: .25rem 0;
    }
    .seq-progress-bar {
      height: 4px; border-radius: 2px;
      background: var(--dark-4); overflow: hidden; margin-top: .4rem;
    }
    .seq-progress-fill {
      height: 100%; background: var(--green);
      transition: width .1s linear; width: 0%;
    }

    /* ─── Responsive ──────────────────────────────────────────── */
    @media (max-width:860px) {
      .main { grid-template-columns:1fr; }
      /* Preview is the hero — show it first on stacked layouts so it isn't
         buried below the full upload panel (measured ~1250px down otherwise). */
      .preview-panel { order:1; position:sticky; top:58px; z-index:20; }
      .upload-panel  { order:2; border-right:none; border-top:1px solid var(--dark-4); }
      .hand-scene    { min-height:320px; }
    }
    @media (max-width:540px) {
      .header  { padding:.85rem 1rem; }
      .header-sub { display:none; }
      .effect-grid { grid-template-columns: repeat(2, 1fr); }
      .upload-panel { padding:1.1rem 1rem; }
    }
  </style>
</head>
<body>

<!-- ─── Header ────────────────────────────────────────────────── -->
<header class="header">
  <div class="header-logo">TwenT3</div>
  <span class="header-sep">|</span>
  <span class="header-sub">Product Preview Generator</span>
  <span class="header-badge">Live Preview</span>
</header>

<!-- ─── Main ──────────────────────────────────────────────────── -->
<div class="main">
  <div class="upload-panel"  id="uploadPanel"></div>
  <div class="preview-panel" id="previewPanel"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   autoimagemorphjs — Adapted from András Jankovics (Public Domain)
   https://github.com/jankovicsandras/autoimagemorphjs

   Automatic feature detection (highest-contrast pixel per grid
   cell) + triangle rasterisation morphing — the same approach
   used by FantaMorph's Face Locator. No user control points needed.
   ═══════════════════════════════════════════════════════════════ */

/* Returns an (m+1)×(n+1) array of [x,y] feature points.
   Border cells stay at exact grid positions; interior cells use
   the pixel with the highest sum of edge-contrast differences —
   automatically finding corners, edges and distinct features.   */
function aim_getfeaturepoints(imgData, n, m) {
  var fpts=[], W=imgData.width, H=imgData.height, d=imgData.data;
  var cw=W/n, ch=H/m;
  for(var j=0; j<=m; j++) {
    fpts[j]=[];
    for(var i=0; i<=n; i++) {
      fpts[j][i]=[i*cw, j*ch];
      if(j>0 && j<m && i>0 && i<n) {
        var fd=H+W, fc=0;
        for(var y=0; y<ch; y++) {
          for(var x=0; x<cw; x++) {
            var px=Math.floor(x+i*cw-cw/2), py=Math.floor(y+j*ch-ch/2);
            if(px<1||px>=W-1||py<1||py>=H-1) continue;
            var idx=(W*py+px)*4, tc=0;
            tc+=Math.abs(d[idx  ]-d[idx+4])+Math.abs(d[idx+1]-d[idx+5])+Math.abs(d[idx+2]-d[idx+6]);
            tc+=Math.abs(d[idx  ]-d[idx-4])+Math.abs(d[idx+1]-d[idx-3])+Math.abs(d[idx+2]-d[idx-2]);
            tc+=Math.abs(d[idx  ]-d[idx+W*4])+Math.abs(d[idx+1]-d[idx+W*4+1])+Math.abs(d[idx+2]-d[idx+W*4+2]);
            tc+=Math.abs(d[idx  ]-d[idx-W*4])+Math.abs(d[idx+1]-d[idx-W*4+1])+Math.abs(d[idx+2]-d[idx-W*4+2]);
            var dist=Math.hypot(x-cw/2, y-ch/2);
            if(tc>fc||(tc===fc&&dist<fd)){fpts[j][i]=[px,py];fc=tc;fd=dist;}
          }
        }
      }
    }
  }
  return fpts;
}

/* Rasterises one morphed triangle into the output pixel buffer.
   ic1/ic2 = source triangle corners in img1/img2 space.
   oc      = output triangle corners (interpolated at alfa).
   alfa    = morph progress 0→1.                               */
function aim_tridraw(d1, W1, H1, d2, W2, H2, outd, outW, outH, ic1, ic2, oc, alfa) {
  var x0=oc[0][0], y0=oc[0][1], x1=oc[1][0], y1=oc[1][1], x2=oc[2][0], y2=oc[2][1];
  var minx=Math.max(0,Math.floor(Math.min(x0,x1,x2)));
  var maxx=Math.min(outW-1,Math.ceil(Math.max(x0,x1,x2)));
  var miny=Math.max(0,Math.floor(Math.min(y0,y1,y2)));
  var maxy=Math.min(outH-1,Math.ceil(Math.max(y0,y1,y2)));
  var denom=(y1-y2)*(x0-x2)+(x2-x1)*(y0-y2);
  if(Math.abs(denom)<0.5) return;
  var inv=1/denom, ia=1-alfa;
  /* clamp limits prevent bilinear reads going out-of-bounds */
  var W1m=W1-1.001, H1m=H1-1.001, W2m=W2-1.001, H2m=H2-1.001;
  for(var py=miny; py<=maxy; py++) {
    for(var px=minx; px<=maxx; px++) {
      var l1=((y1-y2)*(px-x2)+(x2-x1)*(py-y2))*inv;
      var l2=((y2-y0)*(px-x2)+(x0-x2)*(py-y2))*inv;
      var l3=1-l1-l2;
      if(l1<-0.001||l2<-0.001||l3<-0.001) continue;

      /* ── Bilinear sample from img1 ───────────────────────── */
      var sx1=Math.max(0,Math.min(W1m, l1*ic1[0][0]+l2*ic1[1][0]+l3*ic1[2][0]));
      var sy1=Math.max(0,Math.min(H1m, l1*ic1[0][1]+l2*ic1[1][1]+l3*ic1[2][1]));
      var bx1=sx1|0, by1=sy1|0, fx1=sx1-bx1, fy1=sy1-by1;
      var p00=(by1*W1+bx1)*4, p10=p00+4, p01=p00+W1*4, p11=p01+4;
      var w00=(1-fx1)*(1-fy1), w10=fx1*(1-fy1), w01=(1-fx1)*fy1, w11=fx1*fy1;
      var r1=d1[p00]*w00+d1[p10]*w10+d1[p01]*w01+d1[p11]*w11;
      var g1=d1[p00+1]*w00+d1[p10+1]*w10+d1[p01+1]*w01+d1[p11+1]*w11;
      var b1_=d1[p00+2]*w00+d1[p10+2]*w10+d1[p01+2]*w01+d1[p11+2]*w11;

      /* ── Bilinear sample from img2 ───────────────────────── */
      var sx2=Math.max(0,Math.min(W2m, l1*ic2[0][0]+l2*ic2[1][0]+l3*ic2[2][0]));
      var sy2=Math.max(0,Math.min(H2m, l1*ic2[0][1]+l2*ic2[1][1]+l3*ic2[2][1]));
      var bx2=sx2|0, by2=sy2|0, fx2=sx2-bx2, fy2=sy2-by2;
      var q00=(by2*W2+bx2)*4, q10=q00+4, q01=q00+W2*4, q11=q01+4;
      var v00=(1-fx2)*(1-fy2), v10=fx2*(1-fy2), v01=(1-fx2)*fy2, v11=fx2*fy2;
      var r2=d2[q00]*v00+d2[q10]*v10+d2[q01]*v01+d2[q11]*v11;
      var g2=d2[q00+1]*v00+d2[q10+1]*v10+d2[q01+1]*v01+d2[q11+1]*v11;
      var b2_=d2[q00+2]*v00+d2[q10+2]*v10+d2[q01+2]*v01+d2[q11+2]*v11;

      var oi=(py*outW+px)*4;
      outd[oi  ]=r1*ia+r2*alfa;
      outd[oi+1]=g1*ia+g2*alfa;
      outd[oi+2]=b1_*ia+b2_*alfa;
      outd[oi+3]=255;
    }
  }
}

/* Renders one morph frame at alfa (0=img1 only, 1=img2 only) into outd.
   fpts1/fpts2 = feature grids from aim_getfeaturepoints (same n,m).
   The grid is triangulated and each triangle is rasterised via
   aim_tridraw, warping both source images to the interpolated mesh
   then cross-dissolving — identical to FantaMorph's algorithm.   */
function aim_getframe(d1, W1, H1, d2, W2, H2, outd, outW, outH, fpts1, fpts2, alfa) {
  var m=fpts1.length-1, n=fpts1[0].length-1, ia=1-alfa;
  for(var j=0; j<m; j++) {
    for(var i=0; i<n; i++) {
      var f1=fpts1, f2=fpts2;
      /* Interpolated output corners for this grid cell */
      var p00=[f1[j][i][0]*ia+f2[j][i][0]*alfa,         f1[j][i][1]*ia+f2[j][i][1]*alfa];
      var p01=[f1[j][i+1][0]*ia+f2[j][i+1][0]*alfa,     f1[j][i+1][1]*ia+f2[j][i+1][1]*alfa];
      var p10=[f1[j+1][i][0]*ia+f2[j+1][i][0]*alfa,     f1[j+1][i][1]*ia+f2[j+1][i][1]*alfa];
      var p11=[f1[j+1][i+1][0]*ia+f2[j+1][i+1][0]*alfa, f1[j+1][i+1][1]*ia+f2[j+1][i+1][1]*alfa];
      /* Triangle A — top-left */
      aim_tridraw(d1,W1,H1, d2,W2,H2, outd,outW,outH,
        [f1[j][i],f1[j][i+1],f1[j+1][i]], [f2[j][i],f2[j][i+1],f2[j+1][i]],
        [p00,p01,p10], alfa);
      /* Triangle B — bottom-right */
      aim_tridraw(d1,W1,H1, d2,W2,H2, outd,outW,outH,
        [f1[j][i+1],f1[j+1][i+1],f1[j+1][i]], [f2[j][i+1],f2[j+1][i+1],f2[j+1][i]],
        [p01,p11,p10], alfa);
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   PSD PARSING (ag-psd)
   ═══════════════════════════════════════════════════════════════ */
async function parsePSD(file) {
  if (!file.name.toLowerCase().endsWith('.psd') || typeof AgPsd === 'undefined') return null;
  try {
    const buffer = await file.arrayBuffer();
    const psd    = AgPsd.readPsd(buffer, { skipThumbnail: false, useImageData: true });
    const W = psd.width, H = psd.height;

    /* Flatten composite */
    const flatCanvas = document.createElement('canvas');
    flatCanvas.width = W; flatCanvas.height = H;
    const flatCtx = flatCanvas.getContext('2d');
    if (psd.canvas)     flatCtx.drawImage(psd.canvas, 0, 0);
    else if (psd.imageData) flatCtx.putImageData(psd.imageData, 0, 0);
    const flat = flatCanvas.toDataURL();

    /* Extract visible layers (bottom→top = frame 1→last) */
    /* Extract ALL layers, bottom→top, INCLUDING HIDDEN ONES (2026-07-02):
       animation PSDs are usually saved with most frame-layers toggled off
       (the user's dancing PSD had 5 of 6 hidden, the car 14 of 16 →
       "does nothing at all"). Every layer is a frame / depth plane here,
       so Photoshop visibility is irrelevant.                            */
    const layers = [];
    const extractLayers = (children) => {
      if (!children) return;
      for (const layer of children) {
        if (layer.children) { extractLayers(layer.children); continue; }
        if (!layer.canvas && !layer.imageData) continue;
        const lc = document.createElement('canvas');
        lc.width = W; lc.height = H;
        const lx = lc.getContext('2d');
        if (layer.canvas)     lx.drawImage(layer.canvas, layer.left || 0, layer.top || 0);
        else if (layer.imageData) lx.putImageData(layer.imageData, layer.left || 0, layer.top || 0);
        layers.push(lc.toDataURL());
      }
    };
    extractLayers(psd.children);
    return { flat, layers: layers.length ? layers : [flat] };
  } catch (err) {
    console.warn('PSD parse error:', err);
    return null;
  }
}

let handVideoEl  = null;

const FPS        = 12;
const SCALE      = 1;
/* How much of the hand's real motion the card overlay tracks.
   MUST be 1.0 — the card's motion is baked into the video, so the overlay
   has to follow the tracked corners 100% or it visibly tears away from the
   placeholder (dead space at motion extremes). Same principle as an
   After Effects corner-pin: the insert follows the track exactly.
   To make the hand move less, the videos themselves must be re-shot or
   slowed — never reduce this value. */
const MOTION_SCALE = 1.0;
/* Live bounding box of the chroma-keyed card region, updated every frame */
let _liveCardBounds = null;
/* Stable card dimensions — locked on first clean detection, never resized */
let _stableCardW = 0, _stableCardH = 0;
/* Raw card centre from chroma key (12 fps) — smoothing done in draw() at 60 fps */
let _rawCardCX = null, _rawCardCY = null;
let _q0ForExt = null;   /* unflared card quad — portrait extension geometry */
/* Portrait upright-print stabilisers — smoothed centre / held width / bottom,
   so the straight print does not jump left-right or pulse narrow as the card
   rocks (would reveal the black backdrop behind it). */
let _portDL = null, _portDR = null, _portSplitX = 0;  /* v7: per-frame hand shifts + split column */
let _handTmp = null, _handTmpCtx = null;   /* scratch canvas for skin-only hand overlay */

/* square(0..1)² → quad projective point mapper (Heckbert square-to-quad).
   Used by portrait v7 to place the portrait print on the card PLANE, so it
   rocks with the footage. ⚠ The translation term is x0 (NOT x0·w): an early
   x0·w variant was near-correct at mild tilts but wrong at strong
   perspective — it detached the far hand and squashed the print at the rock
   extremes. Validated against cv2.getPerspectiveTransform to 0.0000px
   (scratchpad v7_corner_proto.py, 2026-07-17).                            */
function _quadUV(c) {
  const x0 = c[0].x, y0 = c[0].y, x1 = c[1].x, y1 = c[1].y,
        x2 = c[2].x, y2 = c[2].y, x3 = c[3].x, y3 = c[3].y;
  const dx1 = x1 - x2, dy1 = y1 - y2, dx2 = x3 - x2, dy2 = y3 - y2;
  const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  const den = dx1 * dy2 - dx2 * dy1 || 1e-9;
  const g = (sx * dy2 - sy * dx2) / den;
  const h = (dx1 * sy - dy1 * sx) / den;
  const a = x1 - x0 + g * x1, b = x3 - x0 + h * x3;
  const d = y1 - y0 + g * y1, e = y3 - y0 + h * y3;
  return (u, v) => {
    const w = g * u + h * v + 1;
    return { x: (a * u + b * v + x0) / w, y: (d * u + e * v + y0) / w };
  };
}

/* (Portrait v7 needs NO extra grip data: the hands are translated by the
   exact corner-to-corner vector — print bottom corner minus tracked card
   bottom corner — which preserves the filmed pinch rigidly. An earlier
   fingertip-measurement approach (portrait_grips.json) was removed; the
   separated layers in portrait-layers\ remain for offline verification.)  */

function startHandComposite() {
  handVideoEl  = document.getElementById('handVideo');
  handCanvasEl = document.getElementById('handCanvas');
  if (!handVideoEl || !handCanvasEl) return;

  /* Plain 2D context — handCanvas is only ever DRAWN to (composited),
     never read back, so no willReadFrequently (keeps GPU path fast). */
  handCtx      = handCanvasEl.getContext('2d');
  chromaActive = true;

  /* Choose video based on orientation:
       'lr' → card_01_03.mp4 (left-right rock)
       'ud' → card_02_03.mp4 (up-down rock)           */
  handVideoEl.src         = S.orientation === 'lr' ? 'card_01_03.mp4' : 'card_02_03.mp4';
  handVideoEl.muted       = true;
  handVideoEl.loop        = true;
  handVideoEl.playsInline = true;

  /* Sync tilt duration to video loop */
  handVideoEl.addEventListener('loadedmetadata', () => {
    const dur = handVideoEl.duration;
    if (dur && isFinite(dur) && dur > 0) {
      document.documentElement.style.setProperty('--tilt-dur', dur + 's');
    }
  }, { once: true });

  /* Start the unified compositor chain. The generation token guarantees
     exactly one active chain even across orientation / effect restarts. */
  _composeGen++;
  composite(_composeGen);
  _vfcMediaTime = -1;                    /* stale — new video, new timeline */
  _armVFC(handVideoEl, _composeGen);     /* frame-accurate timestamps       */

  handVideoEl.play().catch(() => {});

  /* Robust playback recovery: browsers pause the video when autoplay is
     blocked or the window is hidden. Keep retrying so the hands return. */
  if (!window._playRecovery) {
    window._playRecovery = true;
    const resume = () => {
      if (handVideoEl && chromaActive && handVideoEl.paused) handVideoEl.play().catch(() => {});
    };
    document.addEventListener('click', resume);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') resume();
    });
    setInterval(resume, 2000);
  }
}

/* ═══════════════════════════════════════════════════════════════
   UNIFIED COMPOSITOR — ONE canvas, ONE loop, perfect frame-lock
   ─────────────────────────────────────────────────────────────
   Every animation frame, from the SAME video frame:
     1. Warp the active effect's source image onto the tracked card
        quad (bottom layer).
     2. Chroma-key the SAME video frame (green → transparent) and draw
        the result (hands + background) on top.
   Because both layers come from one video frame at one currentTime,
   the image and the placeholder are LOCKED together — they cannot
   drift independently. The green hole reveals the image beneath it,
   so there is no dead space (the hole IS where the image is), and the
   hands, being opaque video, always paint on top. This is exactly how
   an After Effects corner-pin composite locks an insert to a track.
   ═══════════════════════════════════════════════════════════════ */
let _composeGen  = 0;
let _composeWork = null, _composeWorkCtx = null;
let _smBR = null, _smBL = null;   /* temporally-smoothed bottom corners */

/* Render ONE composited frame using `mediaTime` — the exact presentation
   timestamp of the video frame being shown. Corners, tilt, hands and image
   all derive from this single time, so they are frame-locked.

   Why mediaTime and not currentTime: `video.currentTime` reports the decode
   position, which LEADS the frame actually painted by drawImage() by ~1-2
   frames. Using it made the image warp to where the card WILL be while the
   hands showed where it IS — so during fast motion the image slid off the
   card (a velocity-dependent offset, worst at the rock extremes). mediaTime
   is the timestamp of the very frame drawImage paints, eliminating that. */
function _composeFrame(mediaTime) {
  _lastComposeTs = performance.now();   /* rAF-watchdog heartbeat */
  const scene = document.getElementById('handScene');
  const v = handVideoEl;
  if (!scene || !v || v.readyState < 2 || !handCtx) return;

  const W = scene.offsetWidth, H = scene.offsetHeight;
  if (!W || !H) return;
  if (handCanvasEl.width  !== W) handCanvasEl.width  = W;
  if (handCanvasEl.height !== H) handCanvasEl.height = H;
  if (!_composeWork) {
    _composeWork    = document.createElement('canvas');
    _composeWorkCtx = _composeWork.getContext('2d', { willReadFrequently: true });
  }
  if (_composeWork.width  !== W) _composeWork.width  = W;
  if (_composeWork.height !== H) _composeWork.height = H;

  const isUD     = S.orientation === 'ud';
  const videoKey = isUD ? 'card_02_03' : 'card_01_03';

  /* ── Letterbox rect of the video inside the scene (shared helper —
        portrait mode shrinks and bottom-anchors the whole scene) ───── */
  const { dx, dy, dw, dh } = _videoLetterbox(W, H);

  /* ── Draw THIS frame, chroma-key it, AND find the 4 card corners in
        ONE pass over the same pixels. Using the LIVE green quad as the
        warp target is what locks the image edges to the placeholder
        edges: both come from the identical pixels of this one frame, so
        they can never drift apart — any jitter is shared, not relative.
        Extreme points of (x+y) and (x−y) give the quad corners; thumbs
        only remove green where they occlude, which is exactly where the
        image should stop (and the thumb is drawn on top to cover it).  */
  const wc = _composeWorkCtx;
  wc.clearRect(0, 0, W, H);
  /* (v6 final: no portrait backdrop fill here — the output scene never draws
     the video background, only skin pixels are lifted from this canvas.)   */
  wc.drawImage(v, dx, dy, dw, dh);
  /* Perf (2026-07-02, "preview sometimes freezes"): only the letterbox band
     dy..dy+dh contains video pixels — scanning just that band instead of the
     full canvas cuts the per-frame pixel work ~3× on portrait scenes.      */
  const bandY = Math.max(0, Math.floor(dy));
  const bandH = Math.min(H - bandY, Math.ceil(dh) + 1);
  /* x-range restricted to the video band too: the portrait ambient
     backdrop outside it must never be chroma-keyed                    */
  const bandX0 = Math.max(0, Math.floor(dx));
  const bandX1 = Math.min(W, Math.ceil(dx + dw));
  const id = wc.getImageData(0, bandY, W, bandH), d = id.data;
  let sMin=Infinity, sMax=-Infinity, fMin=Infinity, fMax=-Infinity, gn=0;
  let TLx=0,TLy=0, TRx=0,TRy=0, BRx=0,BRy=0, BLx=0,BLy=0;
  for (let y = 0; y < bandH; y++) {
    const row = y * W, yAbs = y + bandY;
    for (let xx = bandX0; xx < bandX1; xx++) {
      const i = (row + xx) * 4;
      const g = d[i+1];
      if (g > 100 && g > d[i] * 1.5 && g > d[i+2] * 1.5) {
        d[i+3] = 0; gn++;
        const s = xx + yAbs, f = xx - yAbs;
        if (s < sMin) { sMin = s; TLx = xx; TLy = yAbs; }
        if (s > sMax) { sMax = s; BRx = xx; BRy = yAbs; }
        if (f > fMax) { fMax = f; TRx = xx; TRy = yAbs; }
        if (f < fMin) { fMin = f; BLx = xx; BLy = yAbs; }
      } else if (g > 60 && 2 * g > (d[i] + d[i+2]) * 1.35) {
        /* SOFT keying for the card's anti-aliased edge pixels (2026-07-02,
           3x-zoom diagnosis): the binary threshold left the borderline
           dark-green edge pixels opaque — a broken dark/green rim drawn
           over the print along the hole boundary. Fade them by greenness
           instead: the card edge now blends the print smoothly into the
           scene. Corner detection stays on the strict test above.      */
        const excess = 2 * g - (d[i] + d[i+2]) * 1.35;
        const a = 255 - Math.min(255, Math.round(excess * 3.2));
        if (a < d[i+3]) d[i+3] = a;
      }
    }
  }
  wc.putImageData(id, 0, bandY);

  /* (v6 final: portrait edge fades REMOVED — they darkened hand pixels near
     the band edges, which made the skin extraction eat the hands away there
     ("hands blur at the edges", user 2026-07-04). With the video background
     never drawn in portrait, the fades had no purpose left anyway.)        */

  /* ── Build the warp quad (the LOCKED-IN 0%-dead-space version) ───────────
     Top corners: LIVE green detection (never occluded → perfect).
     Bottom corners: the thumbs occlude them, so they can't be detected live.
     Fit the rigid card shape (from tracking data) onto the live top edge each
     frame (similarity transform) and read the bottom corners off it — the
     bottom is locked to the live top and moves with the card like the top.

     Then FLARE the two bottom corners outward (BOT_OV) so the image overshoots
     the thumb-occluded corners → ZERO black wedges (this is the version the
     user confirmed perfect). The flare overshoot is invisible: hidden behind
     the thumbs/background, only the green hole reveals the image. NO temporal
     smoothing on the bottom — the smoothing was what lagged the bottom and
     made it appear to track differently from the top; without it the bottom
     is locked rigidly to the live top, frame for frame.                    */
  const trackCorners = getDisplayCorners(videoKey, mediaTime);
  let corners = null;

  if (gn > 800 && trackCorners) {
    const liveTL = { x: TLx, y: TLy }, liveTR = { x: TRx, y: TRy };
    const tTL = trackCorners[0], tTR = trackCorners[1], tBR = trackCorners[2], tBL = trackCorners[3];

    const tdx = tTR.x - tTL.x, tdy = tTR.y - tTL.y;
    const ldx = liveTR.x - liveTL.x, ldy = liveTR.y - liveTL.y;
    const tLen2 = tdx*tdx + tdy*tdy || 1;
    const a = (ldx*tdx + ldy*tdy) / tLen2;   /* scale·cosθ */
    const b = (ldy*tdx - ldx*tdy) / tLen2;   /* scale·sinθ */
    const apply = p => ({
      x: liveTL.x + a*(p.x - tTL.x) - b*(p.y - tTL.y),
      y: liveTL.y + b*(p.x - tTL.x) + a*(p.y - tTL.y),
    });
    const reconBR = apply(tBR), reconBL = apply(tBL);
    /* NOTE (2026-07-02): a "flex guard" that swapped reconBR/reconBL for the
       live green extremes was tried here and REMOVED — the raw extremes
       wander along the card hull frame-to-frame, so the quad breathed and
       the image slid around inside the card on EVERY effect (user report:
       "moves left/right and up/down like the 3d effect"). Bottom corners
       must stay the RIGID reconstruction; the playback bottom-gap was fixed
       by frame-accurate mediaTime (_armVFC/_bestMediaTime), not by this.  */

    const q0 = [ liveTL, liveTR, reconBR, reconBL ];
    const cx = (q0[0].x+q0[1].x+q0[2].x+q0[3].x)/4, cy = (q0[0].y+q0[1].y+q0[2].y+q0[3].y)/4;
    const push = (p, s) => ({ x: cx + (p.x-cx)*s, y: cy + (p.y-cy)*s });
    const TOP_OV = 1.03, BOT_OV = 1.28;      /* top tight, bottom flared → 0% dead.
       1.18 still left a thin black wedge along the bottom edge in UD mid-swing
       (user screenshot 2026-07-02): the bottom corners are thumb-occluded in
       the TRACKING data too, so the reconstruction under-reaches there. The
       extra flare is invisible — overshoot hides behind the opaque video.   */
    corners = [ push(liveTL, TOP_OV), push(liveTR, TOP_OV),
                push(reconBR, BOT_OV), push(reconBL, BOT_OV) ];
    _q0ForExt = q0;              /* unflared quad — portrait extension dirs */
    _rawCardCX = cx; _rawCardCY = cy;
  } else {
    corners = trackCorners;
  }

  /* Effect AMOUNT (flip switch / parallax) uses the smooth, correctly-phased
     tracking-data tilt — robust to occlusion — while POSITION uses the quad
     anchored to the live top edge above. */
  const tilt = tiltFromCorners(trackCorners || corners, isUD);

  /* ── PORTRAIT print extension (2026-07-02, final method) ─────────────
     The filmed card is landscape and the footage is never altered.
     Portrait mode extends the PRINT upward from the tracked card: the
     bottom stays locked to the real card (hands grip it exactly as
     filmed — like holding a large portrait print by its bottom), and the
     upper part of the print continues over the plain background above
     the card, drawn AFTER the video so it overlays it. The extension
     follows the card's own edge directions, so it tilts and moves as one
     rigid print. Target print aspect ≈ 4:5 (w:h).                      */
  /* PORTRAIT v6 — FINAL (user-chosen 2026-07-04 night): clicking ▯ Portrait
     must show an ACTUAL PORTRAIT-shaped card. Geometry = the v4 upright
     grip-locked rectangle (sits straight, bottom corners between finger and
     thumb). The v4 alignment complaint (image vs the tilted card's black edge)
     is solved by DRAWING a straight black backing slightly larger than the
     print and HIDING the real tilted card (excluded from the video layer), so
     the black border is aligned with the image by construction.             */
  let extCorners = null, overQuad = null, extClip = null;
  if (S.cardFit === 'portrait' && corners) {
    /* ── PORTRAIT v7 (2026-07-17, Marc's layer-separation concept) ────────
       The placeholder is a TRUE PORTRAIT CARD ON THE CARD PLANE — it rocks
       with the footage exactly like the landscape card — and the two real
       hands are shifted inward per frame so their fingertips pinch its side
       edges at the SAME card height where they pinched the landscape card
       (v_grip ≈ 0.99: the bottom-corner grip, measured from the separated
       layers; see _V_GRIP). Because the print quad and the hand shifts are
       derived from the SAME tracked quad each frame, print and grip cannot
       drift apart — the per-frame lock that a static Photoshop transform
       could not give. Supersedes v4/v6 "sits straight": with the hands
       moving too, the rocking portrait card is coherent (Marc: "rotate the
       placeholder to portrait ... holds it snugly like the landscape
       preview does"). Geometry prototyped + measured offline
       (scratchpad portrait_v7_proto.py / v7_measure_grip.py).            */
    let q0 = (gn > 800 ? _q0ForExt : null);
    if (!q0) {          /* fallback: un-overscan the tracked corners (÷1.10) */
      const ccx = (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4;
      const ccy = (corners[0].y + corners[1].y + corners[2].y + corners[3].y) / 4;
      q0 = corners.map(p => ({ x: ccx + (p.x - ccx) / 1.10, y: ccy + (p.y - ccy) / 1.10 }));
    }
    const map = _quadUV(q0);
    const cardAspect = isUD ? 1.75 : 1.72;
    /* ── Print size (2026-07-20, Marc: "expand to the edges so it sits snug").
       The old fixed PW=0.66 left the portrait print sitting small INSIDE the
       grip with black margin. We now make the print as WIDE as possible — up
       to the full card width (PW=1.0), where its bottom corners land exactly
       on the real gripped card corners = snug by construction, no margin —
       while capping the HEIGHT so the print's top corners never leave the top
       of the frame (a 4:5 portrait at full card width is taller than the
       card, so on a tall/narrow preview full width would overflow and crop
       the design). Result: on a normal wide preview it fills the full grip
       width; on a narrow one it shrinks just enough to stay fully visible.
       PH↔PW are locked to pixel-aspect 0.8 (cardSrcDims 384×480).          */
    const MARGIN = 8;                                  /* px kept clear at frame top */
    const phFromPw = pw => pw * cardAspect / 0.8;
    const topYForPh = ph => {
      const pw = ph * 0.8 / cardAspect;
      const a = map(0.5 - pw / 2, 1 - ph), b = map(0.5 + pw / 2, 1 - ph);
      return Math.min(a.y, b.y);                       /* higher on screen = smaller y */
    };
    const phCap = phFromPw(1.0);                       /* never wider than the card */
    let PH;
    if (topYForPh(phCap) >= MARGIN) {
      PH = phCap;                                      /* full width fits — snug */
    } else {
      let lo = 0.2, hi = phCap;                        /* largest PH whose top stays in-frame */
      for (let it = 0; it < 22; it++) {
        const mid = (lo + hi) / 2;
        if (topYForPh(mid) >= MARGIN) lo = mid; else hi = mid;
      }
      PH = lo;
    }
    const PW = PH * 0.8 / cardAspect;
    const u0 = 0.5 - PW / 2, u1 = 0.5 + PW / 2;
    /* Print bottom edge COLLINEAR with the card's bottom edge (v ∈ [1−PH, 1]):
       the print's bottom corners land exactly where the card's bottom corners
       sit, at the hands' filmed height — the print towers upward from there. */
    const v0 = 1 - PH, v1 = 1;
    const UL = map(u0, v0), UR = map(u1, v0), LR = map(u1, v1), LL = map(u0, v1);
    extCorners = [ UL, UR, LR, LL ];
    extClip = extCorners;

    /* Grip: translate each hand by the EXACT corner-to-corner vector (print
       bottom corner − tracked card bottom corner). A rigid translation
       preserves the filmed pinch↔corner relationship perfectly, so finger
       and thumb wrap the print's bottom corner exactly as they wrap the
       card's in the footage — snug by construction, at every tilt.        */
    _portDL = { x: LL.x - q0[3].x, y: LL.y - q0[3].y };
    _portDR = { x: LR.x - q0[2].x, y: LR.y - q0[2].y };
    _portSplitX = Math.round((q0[0].x + q0[1].x + q0[2].x + q0[3].x) / 4);
    if (window.__dbgGeo) window.__lastGeo = { corners, q0, extCorners, tilt, dL: _portDL, dR: _portDR, splitX: _portSplitX };
  }
  const warpQuad = extCorners || corners;

  /* ── 1. Warp effect source onto the card quad (under the video) ── */
  handCtx.clearRect(0, 0, W, H);
  let src = null;
  try { src = S.frameFn ? S.frameFn(mediaTime, tilt) : null; }
  catch (e) { console.error('[compositor] frameFn error:', e); }

  if (S.cardFit === 'portrait' && extClip) {
    /* ── PORTRAIT v7 draw: flat backdrop (video background never drawn — no
       black placeholder can exist) + print warped onto the rocking portrait
       quad + the two real hands, split at the card centre and each half
       translated so its fingertips pinch the print's side edges.          */
    handCtx.fillStyle = '#050608';
    handCtx.fillRect(0, 0, W, H);
    if (src) perspectiveDraw(handCtx, src, extCorners, 10);
    if (_composeWorkCtx && _portDL && _portDR) {
      const bandTop = Math.max(0, Math.floor(dy));
      const bandH = Math.min(H, Math.ceil(dy + dh)) - bandTop;
      if (bandH > 2) {
        if (!_handTmp) { _handTmp = document.createElement('canvas'); _handTmpCtx = _handTmp.getContext('2d'); }
        if (_handTmp.width !== W) _handTmp.width = W;
        if (_handTmp.height !== bandH) _handTmp.height = bandH;
        const img = _composeWorkCtx.getImageData(0, bandTop, W, bandH), dd = img.data;
        for (let i = 0; i < dd.length; i += 4) {
          const r = dd[i], g = dd[i + 1], b = dd[i + 2];
          /* keep skin (hands): reddish and not dark; drop bg/grey/green */
          if (!(r > 85 && r >= g && r - b > 12)) dd[i + 3] = 0;
        }
        _handTmpCtx.putImageData(img, 0, 0);
        /* left/right hand halves, integer shifts (no resample blur) */
        const spx = Math.max(1, Math.min(W - 1, _portSplitX));
        handCtx.drawImage(_handTmp, 0, 0, spx, bandH,
                          Math.round(_portDL.x), bandTop + Math.round(_portDL.y), spx, bandH);
        handCtx.drawImage(_handTmp, spx, 0, W - spx, bandH,
                          spx + Math.round(_portDR.x), bandTop + Math.round(_portDR.y), W - spx, bandH);
      }
    }
  } else {
    /* ── LANDSCAPE (unchanged, locked-in 0%-dead pipeline) ── */
    if (src && warpQuad) perspectiveDraw(handCtx, src, warpQuad, 10);
    /* ── 2. Chroma-keyed SAME frame (hands + background) on top ── */
    handCtx.drawImage(_composeWork, 0, 0);
  }
}

/* Driver chain — rAF based. rAF keeps firing even when the tab is
   backgrounded (throttled), so the preview never freezes; rVFC, by
   contrast, stops entirely when the page isn't visible. We don't need
   rVFC's mediaTime any more: the image corners are taken from the SAME
   drawImage frame's green pixels inside _composeFrame, so edge-lock is
   self-consistent regardless of the timing source. The generation token
   ensures only the latest chain runs after a restart. */
/* ── Frame-accurate media time (added 2026-07-02) ────────────────────────
   During playback video.currentTime reports the DECODE position, not the
   timestamp of the frame drawImage actually paints — a velocity-dependent
   mismatch that made the reconstructed bottom corners use the card shape
   from the wrong moment (visible as a bottom-edge gap at the fast parts of
   the rock; invisible in paused/seek tests). rVFC gives the painted frame's
   true mediaTime, but rVFC alone freezes in background windows — so rVFC
   only CAPTURES timestamps here, it never drives rendering. The rAF loop +
   watchdog below stay the drivers and fall back to currentTime whenever the
   rVFC timestamp is stale.                                                */
let _vfcMediaTime = -1, _vfcWall = 0;
function _armVFC(v, gen) {
  if (!v || !v.requestVideoFrameCallback) return;
  v.requestVideoFrameCallback((now, meta) => {
    if (gen !== _composeGen) return;         /* video changed — stop chain */
    _vfcMediaTime = meta.mediaTime;
    _vfcWall = performance.now();
    _armVFC(v, gen);
  });
}
function _bestMediaTime() {
  if (_vfcMediaTime >= 0 && performance.now() - _vfcWall < 80) return _vfcMediaTime;
  return handVideoEl ? handVideoEl.currentTime : 0;
}

function composite(gen) {
  if (!chromaActive || gen !== _composeGen) return;
  requestAnimationFrame(() => {
    if (!chromaActive || gen !== _composeGen) return;
    if (handVideoEl && handVideoEl.readyState >= 2) _composeFrame(_bestMediaTime());
    composite(gen);
  });
}

/* ── rAF watchdog (added 2026-07-02) ─────────────────────────────────────
   Chromium suspends requestAnimationFrame entirely when it decides the
   window is occluded/backgrounded (embedded preview panels, minimised
   windows). The video keeps playing — timers and media are NOT suspended —
   so the preview showed hands-video time advancing but a never-painted
   canvas ("the preview is not working"). This interval pumps _composeFrame
   whenever rAF has been silent for >120 ms, giving ~30 fps in any window
   state. When rAF is healthy it does nothing (timestamp check only).     */
let _lastComposeTs = 0;
function _watchdogTick() {
  if (!chromaActive) return;
  if (performance.now() - _lastComposeTs < 120) return;
  if (handVideoEl && handVideoEl.readyState >= 2) _composeFrame(_bestMediaTime());
}
/* Page timers get INTENSIVE THROTTLING after ~5 min hidden (clamped to one
   tick per MINUTE — the preview froze in embedded panels). Worker timers
   are exempt, so the watchdog beat comes from a Worker; the setInterval
   below stays as a fallback for browsers that block inline workers.     */
try {
  const _wUrl = URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),33);'], { type: 'text/javascript' }));
  const _watchdogWorker = new Worker(_wUrl);
  _watchdogWorker.onmessage = _watchdogTick;
} catch (e) { console.warn('[watchdog] worker unavailable, page timer only:', e); }
setInterval(_watchdogTick, 500);

/* Demo placeholder source — a soft green shimmer shown before upload */
let _demoCvs = null;
function demoSource() {
  if (!_demoCvs) {
    _demoCvs = document.createElement('canvas');
    _demoCvs.width = 640; _demoCvs.height = 363;
    const x = _demoCvs.getContext('2d');
    const g = x.createLinearGradient(0, 0, 640, 363);
    g.addColorStop(0, '#1a3a2a'); g.addColorStop(.5, '#52bf90'); g.addColorStop(1, '#1a3a2a');
    x.fillStyle = g; x.fillRect(0, 0, 640, 363);
  }
  return _demoCvs;
}

/* ── Calibration helper ─────────────────────────────────────────────────
   Returns {cX, cY, cardW, cardH} for the neutral card position given the
   video-letterbox rect (dx,dy,dw,dh) and orientation.                    */
function _calibNeutral(dx, dy, dw, dh) {
  let cardW, cardH, cX, cY;
  if (S.orientation === 'lr') {
    cardW = dw * 0.605; cardH = cardW / 1.72;
    cX    = dx + dw * 0.504; cY = dy + dh * 0.451;
  } else {
    cardW = dw * 0.68; cardH = cardW / 1.75;
    cX    = dx + dw * 0.49;  cY = dy + dh * 0.44;
  }
  return { cX, cY, cardW, cardH };
}

/* ── Letterbox helper (shared) ─────────────────────────────────────── */
/* NOTE (2026-07-02): a "centre-cut splice" portrait attempt lived here —
   it removed a vertical band of the video to pull the hands closer. It was
   REMOVED: any tilt makes the card edge step at the seam, and compensating
   shifts break the background/frame instead (user: "this is terrible").
   Portrait mode is now the UPWARD PRINT EXTENSION in _composeFrame, which
   never alters the filmed pixels. Do not re-attempt video splicing.      */

function _videoLetterbox(W, H) {
  const vR = (handVideoEl?.videoWidth  || 1920) /
             (handVideoEl?.videoHeight || 1080);
  const cR = W / H;
  let dx=0, dy=0, dw=W, dh=H;
  if (vR > cR) { dh = W / vR; dy = (H - dh) / 2; }
  else         { dw = H * vR; dx = (W - dw) / 2; }
  /* PORTRAIT v6: shrink the whole scene (hands + card together — a uniform
     scale, no distortion) and anchor it flush to the bottom, leaving
     headroom above for the taller 4:5 upright print. */
  if (S.cardFit === 'portrait') {
    const k = 0.72;
    dx += dw * (1 - k) / 2;               /* keep horizontally centred  */
    dy  = Math.max(0, H - dh * k);        /* flush to the bottom        */
    dw *= k; dh *= k;
  }
  return { dx, dy, dw, dh };
}

/* ── Corner-pin homography (After Effects corner-pin maths) ─────────────
   Returns a CSS matrix3d() string that maps a w×h box (origin top-left)
   onto the 4 screen corners [TL,TR,BR,BL].  This is the projective
   transform AE applies when you corner-pin an insert to a track.        */
function cornerPinMatrix(w, h, c) {
  const x0=c[0].x, y0=c[0].y, x1=c[1].x, y1=c[1].y,
        x2=c[2].x, y2=c[2].y, x3=c[3].x, y3=c[3].y;
  const dx1 = x1-x2, dx2 = x3-x2, dy1 = y1-y2, dy2 = y3-y2;
  const sx  = x0-x1+x2-x3, sy = y0-y1+y2-y3;
  const den = dx1*dy2 - dx2*dy1;
  if (!den) return null;
  const g = (sx*dy2 - sy*dx2) / den;
  const hh = (dx1*sy - dy1*sx) / den;
  const a = x1-x0+g*x1, b = x3-x0+hh*x3;
  const d = y1-y0+g*y1, e = y3-y0+hh*y3;
  return `matrix3d(${a/w},${d/w},0,${g/w},${b/h},${e/h},0,${hh/h},0,0,1,0,${x0},${y0},0,1)`;
}

/* Card area position — corner-pinned to the tracked card quad when
   tracking data is available, so the green overlay and the placeholder
   move together with zero breakage — exactly like the hand and card do. */
function positionCardArea(dx, dy, dw, dh) {
  const ca = document.getElementById('cardArea');
  if (!ca) return;

  /* ── Corner-pin path: glue the div to the per-frame tracked quad ────── */
  const videoKey = S.orientation === 'lr' ? 'card_01_03' : 'card_02_03';
  const time = (handVideoEl && handVideoEl.readyState >= 2) ? handVideoEl.currentTime : 0;
  if (trackingData && trackingData[videoKey]) {
    const corners = getDisplayCorners(videoKey, time);
    if (corners) {
      const W0 = 400, H0 = Math.round(400 / (S.orientation === 'lr' ? 1.72 : 1.75));
      const m = cornerPinMatrix(W0, H0, corners);
      if (m) {
        ca.style.left   = '0px';
        ca.style.top    = '0px';
        ca.style.width  = W0 + 'px';
        ca.style.height = H0 + 'px';
        ca.style.transformOrigin = '0 0';
        ca.style.transform = m;
        /* The corner-pin IS the motion — kill the fake CSS rock so the
           demo face doesn't double-rotate against the real track.       */
        const cc = ca.querySelector('#cardContent');
        if (cc) cc.classList.remove('card-tilting', 'card-tilting-ud');
        return;
      }
    }
  }
  ca.style.transform = '';

  /* ── Live chroma bounding-box path (before tracking data loads) ─────── */
  if (_liveCardBounds && _rawCardCX !== null) {
    ca.style.width  = _stableCardW + 'px';
    ca.style.height = _stableCardH + 'px';
    ca.style.left   = (_rawCardCX - _stableCardW / 2) + 'px';
    ca.style.top    = (_rawCardCY - _stableCardH / 2) + 'px';
    return;
  }

  /* ── Fallback: calibrated percentages (used before video starts) ───── */
  if (dx === undefined) {
    const scene = document.getElementById('handScene');
    if (!scene) return;
    const W = scene.offsetWidth, H = scene.offsetHeight;
    ({ dx, dy, dw, dh } = _videoLetterbox(W, H));
  }

  const { cX, cY, cardW, cardH } = _calibNeutral(dx, dy, dw, dh);
  ca.style.width  = Math.round(cardW) + 'px';
  ca.style.height = Math.round(cardH) + 'px';
  ca.style.left   = Math.round(cX - cardW / 2) + 'px';
  ca.style.top    = Math.round(cY - cardH / 2) + 'px';
}

function stopHandComposite() {
  chromaActive = false;        /* compositor chain self-exits next tick */
  _composeGen++;               /* invalidate any in-flight compositor chain */
  _smBR = null; _smBL = null;  /* reset bottom-corner smoothing state */
  S.frameFn = null;
  _liveCardBounds = null;
  _stableCardW = 0; _stableCardH = 0;
  _rawCardCX = null; _rawCardCY = null;
  /* Remove any legacy per-effect overlay canvases (no longer created,
     but harmless to clean up if a stale one exists). */
  ['_flipOverlay', '_morphOverlay', '_morphSVG', '_depthOverlay', '_seqOverlay',
   '_animOverlay', '_zoomOverlay', '_stereoOverlay'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.remove();
  });
  if (handVideoEl) { handVideoEl.pause(); handVideoEl.src = ''; }
  if (S.animFrame) { cancelAnimationFrame(S.animFrame); S.animFrame = null; }
}

/* ═══════════════════════════════════════════════════════════════
   MOUSE TRACKING
   ═══════════════════════════════════════════════════════════════ */
function attachMouseTracking() {
  const scene = document.getElementById('handScene');
  if (!scene) return;
  scene.addEventListener('mousemove', e => {
    const r  = scene.getBoundingClientRect();
    S.mouseX = ((e.clientX - r.left) / r.width  - 0.5) * 2;
    S.mouseY = ((e.clientY - r.top)  / r.height - 0.5) * 2;
  });
  scene.addEventListener('mouseleave', () => { S.mouseX = 0; S.mouseY = 0; });
}

/* ═══════════════════════════════════════════════════════════════
   ORIENTATION TOGGLE
   ═══════════════════════════════════════════════════════════════ */
function setOrientation(orient) {
  if (orient === S.orientation) return;
  S.orientation = orient;

  /* Update toggle button states (scoped — the fit bar reuses the class) */
  document.querySelectorAll('#orientBar .orient-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.orient === orient);
  });

  /* Restart with new video — regenerate if images ready, else placeholder */
  stopHandComposite();
  const eff    = EFFECTS[S.effectIdx];
  const ready  = S.images.filter(Boolean).length >= eff.numImages;
  if (ready) generatePreview();
  else       showPlaceholder();
}

/* Landscape / Portrait image fit (2026-07-02): portrait shows the WHOLE
   image un-cropped over a blurred fill; landscape is the classic cover
   crop. Re-renders the active effect so the change is instant.        */
function setCardFit(fit) {
  if (fit === S.cardFit) return;
  S.cardFit = fit;
  document.querySelectorAll('#fitBar .orient-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.fit === fit);
  });
  const eff   = EFFECTS[S.effectIdx];
  const ready = eff.id === 'sequence' ? S.seqFrames.length > 0
                                      : S.images.filter(Boolean).length >= eff.numImages;
  if (ready) generatePreview();
}

/* ═══════════════════════════════════════════════════════════════
   BUILD PREVIEW PANEL
   ═══════════════════════════════════════════════════════════════ */
function buildPreviewPanel(demoMode) {
  const eff       = EFFECTS[S.effectIdx];
  const hasOrient = eff.orientations.length > 1;
  const lrLabel   = '↔ Left / Right';
  const udLabel   = '↕ Up / Down';
  const isUD      = S.orientation === 'ud';
  const tiltClass = isUD ? 'card-tilting-ud' : 'card-tilting';

  /* Demo placeholder — always a single green shimmer, no animation.
     The card-tilting class rocks the whole card; no flip here.    */
  const demoInner = demoMode
    ? `<div class="demo-card-face"><span>${eff.name}</span></div>`
    : '<div class="spinner"></div>';

  /* cardArea/cardContent kept in the DOM (effects receive cardContent as a
     handle) but hidden — the unified compositor canvas now does ALL
     rendering, so nothing must show through the green hole behind it. */
  previewPanel.innerHTML = `
    <div class="hand-scene" id="handScene">
      <div class="scene-bg"></div>
      <div id="cardArea" style="display:none">
        <div id="cardContent" class="${tiltClass}">
          ${demoInner}
        </div>
      </div>
      <video id="handVideo" muted playsinline loop preload="auto"></video>
      <canvas id="handCanvas"></canvas>
    </div>

    <div class="preview-footer" id="previewFooter">
      <div class="preview-effect-name">${eff.icon} ${demoMode ? eff.name : eff.name + ' Preview'}</div>
      <div class="preview-hint" id="previewHint">${demoMode ? 'Upload your image then click Generate Preview' : eff.hintText}</div>

      ${hasOrient ? `
      <div class="orient-bar" id="orientBar">
        <button class="orient-btn${S.orientation === 'lr' ? ' active' : ''}" data-orient="lr"
                onclick="setOrientation('lr')">${lrLabel}</button>
        <button class="orient-btn${S.orientation === 'ud' ? ' active' : ''}" data-orient="ud"
                onclick="setOrientation('ud')">${udLabel}</button>
      </div>` : ''}

      <div class="orient-bar" id="fitBar">
        <button class="orient-btn${S.cardFit === 'landscape' ? ' active' : ''}" data-fit="landscape"
                onclick="setCardFit('landscape')">▭ Landscape</button>
        <button class="orient-btn${S.cardFit === 'portrait' ? ' active' : ''}" data-fit="portrait"
                onclick="setCardFit('portrait')">▯ Portrait</button>
      </div>

      <div class="preview-controls" id="previewControls"></div>
      <div class="preview-disclaimer">This preview is a demonstration only. It is not a true
        representation of the finished product: real lenticular prints are sharper, with
        smoother motion and true depth that no screen can reproduce.</div>
    </div>`;

  /* Demo mode shows the shimmer placeholder; effect mode sets its own
     frameFn in the render* function called right after this returns. */
  S.frameFn = demoMode ? ((now, tilt) => demoSource()) : null;

  attachMouseTracking();
  startHandComposite();
  return {
    cardContent:     document.getElementById('cardContent'),
    previewControls: document.getElementById('previewControls'),
    previewHint:     document.getElementById('previewHint'),
  };
}

function addCtrl(label, icon, onClick, active) {
  const ctrl = document.getElementById('previewControls');
  if (!ctrl) return;
  const btn = document.createElement('button');
  btn.className = 'btn-ctrl' + (active ? ' active' : '');
  btn.innerHTML = `${icon} ${label}`;
  btn.onclick   = onClick;
  ctrl.appendChild(btn);
  return btn;
}

function loadImages(srcs) {
  return Promise.all(srcs.filter(Boolean).map(src => new Promise((res, rej) => {
    const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = src;
  })));
}

/* ═══════════════════════════════════════════════════════════════
   SHOW PLACEHOLDER / GENERATE
   ═══════════════════════════════════════════════════════════════ */
function showPlaceholder() {
  stopHandComposite();
  buildPreviewPanel(true);
}

function generatePreview() {
  stopHandComposite();
  const refs = buildPreviewPanel(false);
  refs.cardContent.innerHTML = '';
  ({
    flip:         renderFlip,
    /* True feature morph — face-landmark Delaunay mesh (or optical flow
       for non-faces), pre-generated frames scrubbed by the card tilt
       through the unified compositor (frameFn), same as every effect. */
    morph:        renderMorph,
    threed:       renderThreed,
    layered3d:    renderLayered3d,
    animation:    renderAnimation,
    zoom:         renderZoom,
    stereoscopic: renderStereoscopic,
    sequence:     renderSequence,
  })[EFFECTS[S.effectIdx].id](refs.cardContent, refs);
}

/* ═══════════════════════════════════════════════════════════════
   RENDER: 2 Image Flip
/* ═══════════════════════════════════════════════════════════════
   PERSPECTIVE WARP UTILITIES
   ─────────────────────────────────────────────────────────────
   perspectiveDraw(ctx, src, corners, N)
     Draws src (HTMLCanvasElement / HTMLImageElement) perspective-
     warped into the quad defined by corners [TL,TR,BR,BL] using
     an N×N triangle grid with affine mapping per cell.  N=8 gives
     good quality with 128 draw calls — imperceptible seams.

   getDisplayCorners(videoKey, time)
     Looks up per-frame card corners from tracking_data.json for
     the given video and playback time, then scales them from the
     1920×1080 video coordinate space to the live handScene size.
     Falls back to the chroma-key bounding box if data missing.

   drawCover(ctx, img, W, H)
     Draws img into a W×H canvas centred and cropped (object-fit:cover).
   ═══════════════════════════════════════════════════════════════ */

function perspectiveDraw(ctx, src, corners, N) {
  N = N || 8;
  const srcW = src.width  || src.naturalWidth  || 320;
  const srcH = src.height || src.naturalHeight || 186;

  /* Bilinear interpolation of the 4-corner quad */
  function bilerp(t, s) {
    const top = { x: corners[0].x + t*(corners[1].x-corners[0].x),
                  y: corners[0].y + t*(corners[1].y-corners[0].y) };
    const bot = { x: corners[3].x + t*(corners[2].x-corners[3].x),
                  y: corners[3].y + t*(corners[2].y-corners[3].y) };
    return { x: top.x + s*(bot.x-top.x), y: top.y + s*(bot.y-top.y) };
  }

  /* Affine triangle: source UV → canvas XY via Cramer's rule.
     The clip path is expanded ~0.75px outward from the triangle centroid
     so adjacent triangles overlap slightly — kills the antialiased seam
     grid lines that exact clipping leaves between cells.               */
  function drawTri(x0,y0,x1,y1,x2,y2, u0,v0,u1,v1,u2,v2) {
    const det = u0*(v1-v2) + u1*(v2-v0) + u2*(v0-v1);
    if (Math.abs(det) < 0.5) return;
    const a = (x0*(v1-v2) + x1*(v2-v0) + x2*(v0-v1)) / det;
    const b = (y0*(v1-v2) + y1*(v2-v0) + y2*(v0-v1)) / det;
    const c = (u0*(x1-x2) + u1*(x2-x0) + u2*(x0-x1)) / det;
    const d = (u0*(y1-y2) + u1*(y2-y0) + u2*(y0-y1)) / det;
    const e = (x0*(u1*v2-u2*v1) + x1*(u2*v0-u0*v2) + x2*(u0*v1-u1*v0)) / det;
    const f = (y0*(u1*v2-u2*v1) + y1*(u2*v0-u0*v2) + y2*(u0*v1-u1*v0)) / det;
    const gx = (x0+x1+x2)/3, gy = (y0+y1+y2)/3;
    const PAD = 0.75;
    const ex0 = expand(x0,y0), ex1 = expand(x1,y1), ex2 = expand(x2,y2);
    function expand(px, py) {
      const ddx = px-gx, ddy = py-gy;
      const len = Math.sqrt(ddx*ddx+ddy*ddy) || 1;
      return { x: px + ddx/len*PAD, y: py + ddy/len*PAD };
    }
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(ex0.x,ex0.y); ctx.lineTo(ex1.x,ex1.y); ctx.lineTo(ex2.x,ex2.y);
    ctx.closePath(); ctx.clip();
    ctx.transform(a,b,c,d,e,f);
    ctx.drawImage(src, 0, 0, srcW, srcH);
    ctx.restore();
  }

  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const t0=i/N, t1=(i+1)/N, s0=j/N, s1=(j+1)/N;
      const p00=bilerp(t0,s0), p10=bilerp(t1,s0);
      const p11=bilerp(t1,s1), p01=bilerp(t0,s1);
      const u0=t0*srcW, u1=t1*srcW, v0=s0*srcH, v1=s1*srcH;
      drawTri(p00.x,p00.y, p10.x,p10.y, p11.x,p11.y, u0,v0, u1,v0, u1,v1);
      drawTri(p00.x,p00.y, p11.x,p11.y, p01.x,p01.y, u0,v0, u1,v1, u0,v1);
    }
  }
}

/* ── Neutral calibrated corners (scene pixel coords) ───────────────────
   Returns the 4 card corners at the resting neutral position.
   Used by getDisplayCorners to blend tracking/chroma corners toward
   neutral at MOTION_SCALE, giving 50% hand motion.                     */
function _neutralCorners(videoKey, dx, dy, dw, dh) {
  let cardW, cardH, cX, cY;
  if (videoKey === 'card_01_03') {
    cardW = dw * 0.605; cardH = cardW / 1.72;
    cX = dx + dw * 0.504; cY = dy + dh * 0.451;
  } else {
    cardW = dw * 0.68; cardH = cardW / 1.75;
    cX = dx + dw * 0.49;  cY = dy + dh * 0.44;
  }
  const x = cX - cardW/2, y = cY - cardH/2;
  return [{x,y},{x:x+cardW,y},{x:x+cardW,y:y+cardH},{x,y:y+cardH}];
}

/* Blend two corner arrays at ratio t toward b (t=0→a, t=1→b) */
function _blendCorners(a, b, t) {
  return a.map((pa, i) => ({
    x: pa.x + (b[i].x - pa.x) * t,
    y: pa.y + (b[i].y - pa.y) * t,
  }));
}

/* ── Card tilt from the TRACKED GEOMETRY (not a keyframe guess) ──────────
   The card's real viewing angle is written in its corners: as it rocks, the
   near edge grows and the far edge shrinks (perspective foreshortening). The
   signed edge-length ratio gives the true tilt, and because it is computed
   from the very corners we warp the image onto, it is automatically phase-
   locked to the displayed card — every tilt-driven effect (flip, depth,
   animation, zoom, sequence) now moves in exact sync with the visible rock.

   This replaced a hand-tuned keyframe table that was INVERTED and out of
   phase vs the real motion, which de-synced all the effects.

   `ratio` spans roughly ±0.13 (LR) / ±0.09 (UD) for the filmed rock; the
   per-orientation scale maps that to the ±1 range the effects expect.     */
const _TILT_SCALE = { lr: 7.6, ud: 21.0 };
function tiltFromCorners(c, isUD) {
  if (!c) return 0;
  const d = (a, b) => Math.hypot(c[a].x - c[b].x, c[a].y - c[b].y);
  let ratio;
  if (isUD) { const top = d(0,1), bot = d(3,2); ratio = (bot - top) / (bot + top); }
  else      { const left = d(0,3), right = d(1,2); ratio = (right - left) / (right + left); }
  return Math.max(-1, Math.min(1, ratio * (isUD ? _TILT_SCALE.ud : _TILT_SCALE.lr)));
}

/* ── Per-video tilt range, measured once from the tracking data itself ────
   The two rocks are NOT symmetric (LR spans ≈ −0.98..+0.96 but UD only
   ≈ −0.63..+1.0), so effects that SWEEP the tilt range (flip, morph) must
   normalise against the video's real extremes — otherwise the UD sweep
   never reaches pure image A at the bottom of the rock and idles ~60/40
   blended. Computed from the same tiltFromCorners the compositor uses, so
   it is exact for whatever footage is loaded (re-tracking new videos
   updates it automatically).                                             */
let _tiltRange = null;
function _computeTiltRanges(d) {
  const out = {};
  for (const key in d) {
    const frames = d[key] && d[key].frames;
    if (!frames) continue;
    const isUD = key.indexOf('card_02') === 0 || key.indexOf('hands_02') === 0;
    let mn = Infinity, mx = -Infinity;
    for (const f of frames) {
      if (!f) continue;
      const t = tiltFromCorners(f.map(p => ({ x: p[0], y: p[1] })), isUD);
      if (t < mn) mn = t;
      if (t > mx) mx = t;
    }
    if (mx > mn) out[key] = { min: mn, max: mx };
  }
  return out;
}
/* Raw tilt → 0..1 sweep position across the current video's real range.
   0 = one extreme of the rock (image A), 1 = the other (image B).       */
function tiltSweepT(tilt) {
  const key = S.orientation === 'ud' ? 'card_02_03' : 'card_01_03';
  const r = _tiltRange && _tiltRange[key];
  const t = r ? (tilt - r.min) / (r.max - r.min) : (tilt + 1) / 2;
  return t < 0 ? 0 : t > 1 ? 1 : t;
}

/* Keyframe fallback, used only before tracking_data.json has loaded. */
const CARD_LR_KF = [
  {t:0.00, v:-12}, {t:0.20, v:-4},
  {t:0.40, v: 10}, {t:0.60, v: 10},
  {t:0.80, v:  3}, {t:1.00, v:-12}
];
const CARD_UD_KF = [
  {t:0.00, v:  8}, {t:0.20, v:  2},
  {t:0.40, v: -7}, {t:0.60, v: -7},
  {t:0.80, v: -1}, {t:1.00, v:  8}
];
function _lerpCardKF(vp, kf) {
  if (vp <= kf[0].t) return kf[0].v;
  for (let i = 0; i < kf.length - 1; i++) {
    if (vp >= kf[i].t && vp <= kf[i+1].t) {
      const p = (vp - kf[i].t) / (kf[i+1].t - kf[i].t);
      return kf[i].v + (kf[i+1].v - kf[i].v) * p*p*(3-2*p);
    }
  }
  return kf[kf.length-1].v;
}
function cardTiltNorm(time, isUD) {
  const videoKey = isUD ? 'card_02_03' : 'card_01_03';
  const c = getDisplayCorners(videoKey, time);
  if (c && trackingData && trackingData[videoKey]) return tiltFromCorners(c, isUD);
  /* fallback before tracking data is available */
  const dur = (handVideoEl && isFinite(handVideoEl.duration) && handVideoEl.duration)
              ? handVideoEl.duration : 3;
  const vp  = (time % dur) / dur;
  const v   = _lerpCardKF(vp, isUD ? CARD_UD_KF : CARD_LR_KF);
  return isUD ? (v - 0.5) / 7.5 : (v + 1) / 11;
}

function getDisplayCorners(videoKey, time) {
  const scene = document.getElementById('handScene');
  if (!scene || scene.offsetWidth === 0) return null;
  const sW = scene.offsetWidth, sH = scene.offsetHeight;

  /* ── Tracking-data path ───────────────────────────────────────────────
     Sub-frame interpolation: blend between the two nearest tracked frames
     so the quad moves continuously instead of snapping per video frame.
     Overscan: inflate the quad 2.5% about its centroid so the image always
     fully covers the card edge — the bleed is hidden behind the opaque
     video, exactly like overscanning an After Effects corner-pin insert. */
  if (trackingData && trackingData[videoKey]) {
    const td = trackingData[videoKey];
    const fExact = Math.max(0, Math.min(td.frames.length - 1, time * td.fps));
    const f0 = Math.floor(fExact);
    const f1 = Math.min(td.frames.length - 1, f0 + 1);
    const ft = fExact - f0;
    const raw0 = td.frames[f0], raw1 = td.frames[f1];
    if (raw0 && raw1) {
      const vW = td.width, vH = td.height;
      const { dx, dy, dw, dh } = _videoLetterbox(sW, sH);
      const tracked = raw0.map((pt, i) => ({
        x: (pt[0] + (raw1[i][0] - pt[0]) * ft) / vW * dw + dx,
        y: (pt[1] + (raw1[i][1] - pt[1]) * ft) / vH * dh + dy,
      }));
      /* Overscan about centroid — print-style bleed. The held card bows
         slightly so its edges curve outside the straight 4-corner quad;
         10% bleed swallows the bow completely. The excess is invisible:
         it hides behind the opaque video, only the keyed green hole
         reveals the overlay. */
      const OVERSCAN = 1.10;
      const cx = (tracked[0].x + tracked[1].x + tracked[2].x + tracked[3].x) / 4;
      const cy = (tracked[0].y + tracked[1].y + tracked[2].y + tracked[3].y) / 4;
      return tracked.map(p => ({
        x: cx + (p.x - cx) * OVERSCAN,
        y: cy + (p.y - cy) * OVERSCAN,
      }));
    }
  }
  /* ── Fallback 1: chroma-key bounding box as flat rectangle ─── */
  if (_rawCardCX !== null && _stableCardW > 0) {
    /* Re-derive the letterbox rect from scene + video dimensions */
    const { dx, dy, dw, dh } = _videoLetterbox(sW, sH);
    const neutral = _neutralCorners(videoKey, dx, dy, dw, dh);
    /* Live chroma-key centre → flat corners */
    const lx = _rawCardCX - _stableCardW/2, ly = _rawCardCY - _stableCardH/2;
    const lw = _stableCardW, lh = _stableCardH;
    const live = [{x:lx,y:ly},{x:lx+lw,y:ly},{x:lx+lw,y:ly+lh},{x:lx,y:ly+lh}];
    return _blendCorners(neutral, live, MOTION_SCALE);
  }
  /* ── Fallback 2: calibrated percentages (works before video/tracking ready) ─── */
  {
    const { dx, dy, dw, dh } = _videoLetterbox(sW, sH);
    return _neutralCorners(videoKey, dx, dy, dw, dh);
  }
}

/* Effect source-canvas dimensions — portrait sources for the upright
   portrait print so the perspective warp doesn't stretch anything.     */
function cardSrcDims() {
  return S.cardFit === 'portrait' ? { CW: 384, CH: 480 } : { CW: 640, CH: 363 };
}

function drawCover(ctx, img, W, H) {
  /* Draw img centred + cropped into W×H (object-fit: cover) — ALWAYS.
     A portrait "blur-fill" variant (blurred bars beside a contained
     image) was tried and REMOVED 2026-07-03: on real photos it read as
     smeared/blurry print edges (user screenshots). Real prints are
     full-bleed; the portrait source canvas is already 4:5 via
     cardSrcDims(), so the crop on portrait photos is mild.            */
  const iW = img.naturalWidth  || img.width  || W;
  const iH = img.naturalHeight || img.height || H;
  const ir = iW/iH, cr = W/H;
  let sx, sy, sw, sh;
  if (ir > cr) { sh=iH; sw=sh*cr; sx=(iW-sw)/2; sy=0; }
  else         { sw=iW; sh=sw/cr; sx=0; sy=(iH-sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
}

/* ═══════════════════════════════════════════════════════════════
   RENDER: Flip — perspective-tracked image crossfade
   ─────────────────────────────────────────────────────────────
   Full-scene canvas (z:1) sits below the chroma hand canvas (z:2).
   Per-frame corner data from tracking_data.json is used to
   perspective-warp both images to the exact card quad each frame.
   Crossfade opacity is driven by video currentTime via lerpKF,
   same logic as before — no separate CSS animation needed.
   ═══════════════════════════════════════════════════════════════ */
function renderFlip(cc) {
  cc.innerHTML = '';
