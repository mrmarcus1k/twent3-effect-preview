  /* Pre-load both images onto fixed-size card-aspect canvases. */
  const { CW, CH } = cardSrcDims();
  const offA = document.createElement('canvas'); offA.width=CW; offA.height=CH;
  const offB = document.createElement('canvas'); offB.width=CW; offB.height=CH;
  const comp = document.createElement('canvas'); comp.width=CW; comp.height=CH;
  const ctxA = offA.getContext('2d');
  const ctxB = offB.getContext('2d');
  const cctx = comp.getContext('2d');
  let imgsReady = 0;
  const imgA = new Image(), imgB = new Image();
  function onImgLoad() {
    if (++imgsReady < 2) return;
    drawCover(ctxA, imgA, CW, CH);
    drawCover(ctxB, imgB, CW, CH);
  }
  imgA.onload = imgB.onload = onImgLoad;
  imgA.src = S.images[0]; imgB.src = S.images[1];
  if (imgA.complete) onImgLoad();
  if (imgB.complete) onImgLoad();

  let paused = false, op = 0;

  /* frameFn: composite A→B crossfade on a FLAT canvas, return it.
     The compositor does ONE perspective warp of the result — so there are
     never two alpha-blended triangle grids overlapping (the old "squares").

     FLIP TIMING (2026-07-25) — NARROW-BAND ANGLE FLIP. Third and current
     method; the two it replaces were both measured and both rejected:
       · 2026-07-17 "morph sweep" (smoothstep over the WHOLE tilt range):
         MEASURED 94% of the rock showing an A+B blend, only 6% clean. Not a
         flip at all — a permanent double exposure. Marc: "showing both
         images when it flips" (confirmed on the live site by screenshot).
       · 2026-07-24 "turnaround snap" (switch only at the parked extremes):
         0% blend, but the swap lands where the card is STILL, so nothing
         masks it. Marc: "not smooth, hard transitioning".
     The fix is to keep the crossfade TILT-DRIVEN (angle-based, like a real
     lenticular: the image you see is a function of viewing angle) but to
     confine it to a BAND about the centre of the rock. Outside the band the
     card holds ONE clean image; inside it the images cross-fade smoothly
     while the card is moving, so the motion masks the dissolve. BAND is the
     single tuning knob — smaller = crisper flip / more sudden, larger =
     smoother / more ghosting. FOLLOW must stay fast enough that `op` tracks
     the band instead of lagging across it and re-widening the blend.      */
  const BAND   = 0.30;   /* fraction of the rock spent transitioning */
  const FOLLOW = 0.30;   /* how quickly op chases the target         */
  S.frameFn = (now, tilt) => {
    if (imgsReady < 2) return null;

    const sw = tiltSweepT(tilt);                    /* 0..1 across the rock */
    const c  = (sw - (0.5 - BAND / 2)) / BAND;      /* 0..1 across the band */
    const k  = c < 0 ? 0 : c > 1 ? 1 : c;
    const lensT = k * k * (3 - 2 * k);              /* smoothstep in-band   */
    if (!paused) op += (lensT - op) * FOLLOW;       /* smooth follow        */
    const a = op < 0 ? 0 : op > 1 ? 1 : op;

    /* TRUE CROSS-DISSOLVE — A fades OUT as B fades in (fixed 2026-07-25).
       The old code drew A at globalAlpha 1 ALWAYS and only faded B in on top.
       That silently relies on B being a fully opaque rectangle: wherever B is
       TRANSPARENT (cut-out artwork, logos, PNGs with alpha — very common for
       lenticular designs) B can never cover A, so image A stayed visible at
       full strength even at the end of the flip. Marc: "the black Jesus is
       still showing when the white Jesus is there ... why does black Jesus
       not disappear when it flips". Reproduced with two transparent-background
       discs: at full B, the ring where B is transparent still read pure A
       (255,0,0,255). Fading BOTH layers makes the swap complete for opaque
       and transparent artwork alike.
       ⚠ Verify this with images that have TRANSPARENT backgrounds — solid
       opaque test colours cover each other and hide this class of bug.     */
    cctx.clearRect(0, 0, CW, CH);
    if (a < 0.998) { cctx.globalAlpha = 1 - a; cctx.drawImage(offA, 0, 0); }
    if (a > 0.002) { cctx.globalAlpha = a;     cctx.drawImage(offB, 0, 0); }
    cctx.globalAlpha = 1;
    return comp;
  };

  addCtrl('Pause', '⏸', () => { paused = !paused; }, false);
}

/* ═══════════════════════════════════════════════════════════════
   RENDER: Morph — autoimagemorphjs feature-based pixel warping
   ─────────────────────────────────────────────────────────────
   Uses aim_getfeaturepoints (automatic highest-contrast pixel per
   grid cell — same principle as FantaMorph's Face Locator) and
   aim_getframe (triangle rasterisation + cross-dissolve) to
   pre-compute FRAMES morph frames. Each frame warps both source
   images toward the interpolated mesh then dissolves between them.
   Completely separate from renderFlip — no shared code.
   ═══════════════════════════════════════════════════════════════ */

/* ── Face-api model loader — GLOBAL one-shot promise ──────────────────
   (fixed 2026-07-18) Models used to load in a fire-and-forget block
   LOCAL to each renderMorph call, setting a local _faceApiReady flag,
   while generateFrames started just 60ms later and only CHECKED the
   flag. Parsing the 5.6MB SSD detector takes 1-3s, so generation won
   the race every single time: detection was skipped, every face pair
   silently fell to the optical-flow path (the "liquify swirl"), and
   PATH A never ran in practice. generateFrames must AWAIT this shared
   promise (with a timeout cap) before deciding which path to take.  */
let _faceModelsPromise = null;
function ensureFaceModels() {
  if (_faceModelsPromise) return _faceModelsPromise;
  _faceModelsPromise = (async () => {
    const st = { ready: false, ssd: false };
    try {
      if (typeof faceapi === 'undefined') return st;
      await faceapi.nets.tinyFaceDetector.loadFromUri('/models');
      await faceapi.nets.faceLandmark68Net.loadFromUri('/models');
      st.ready = true;
      try {
        await faceapi.nets.ssdMobilenetv1.loadFromUri('/models');
        st.ssd = true;
      } catch(e) { console.warn('[morph] SSD detector unavailable, using tiny:', e); }
      console.log('[morph] face-api models ready (ssd=' + st.ssd + ')');
    } catch(e) { console.warn('[morph] face-api load failed:', e); }
    return st;
  })();
  return _faceModelsPromise;
}

function renderMorph(cc) {
  const ca    = document.getElementById('cardArea');
  const scene = document.getElementById('handScene');

  cc.classList.remove('card-tilting', 'card-tilting-ud');
  cc.removeAttribute('style');
  cc.innerHTML = '';
  if (ca) ca.style.overflow = '';
  scene.style.overflow = '';

  document.getElementById('_morphOverlay')?.remove();
  document.getElementById('_morphSVG')?.remove();

  /* ── Work canvas — 320×186 offscreen; receives ImageData frames ─
     the unified compositor warps this to the live card corners.    */
  const { CW: _dW, CH: _dH } = cardSrcDims();
  const MW = Math.round(_dW / 2), MH = Math.round(_dH / 2);
  const workCvs = document.createElement('canvas');
  workCvs.width = MW; workCvs.height = MH;
  const workCtx = workCvs.getContext('2d');

  /* Number of pre-computed frames */
  const FRAMES = 40;
  let morphFrames = null;

  /* ── Loading progress — silenced: image A shows on card during generation ── */
  function showProgress(pct, label) { /* no-op — no loading overlay */ }

  /* ── Preview canvas: shows image A on the card while frames generate ── */
  const previewCvs = document.createElement('canvas');
  previewCvs.width = MW; previewCvs.height = MH;
  const previewCtx = previewCvs.getContext('2d');
  let previewReady = false;
  {
    const tmpImg = new Image();
    tmpImg.onload = () => {
      drawCover(previewCtx, tmpImg, MW, MH);
      previewReady = true;
    };
    tmpImg.src = S.images[0];
    if (tmpImg.complete && tmpImg.naturalWidth > 0) {
      drawCover(previewCtx, tmpImg, MW, MH);
      previewReady = true;
    }
  }

  /* ── Frame pre-generation ────────────────────────────────── */
  /* Kick off the global model load NOW so it overlaps image decode.
     SSD MobileNet v1 (added 2026-07-02) is the PRIMARY detector — it is far
     more robust than TinyFaceDetector, which kept missing the user's faces
     and silently degraded every face morph to an optical-flow crossfade.
     Tiny stays as fallback if the SSD weights fail to load.              */
  ensureFaceModels();

  /* ── Bowyer-Watson Delaunay triangulation ─────────────────────────────
     Input: pts = [[x,y], …]
     Output: array of [i0,i1,i2] index triples                            */
  function delaunay(pts) {
    const n = pts.length;
    /* Super-triangle big enough to contain all points */
    const M = 1e6;
    const superPts = [[0,-M],[M*2,M],[(-M)*2,M]];
    const all = pts.concat(superPts);
    const si = n, sj = n+1, sk = n+2;
    let tris = [[si,sj,sk]];

    function circumscribes(ti, px, py) {
      const [a,b,c] = tris[ti].map(i=>all[i]);
      const ax=a[0]-px, ay=a[1]-py;
      const bx=b[0]-px, by=b[1]-py;
      const cx=c[0]-px, cy=c[1]-py;
      /* In-circle determinant sign depends on triangle WINDING (fixed
         2026-07-18): without the orientation factor, CW-wound triangles
         give an inverted test — harmless at ~100 points but at the
         hybrid's ~250 points it corrupted the whole mesh (2900 triangles
         instead of ~490, overlapping slivers + black pinholes).
         Validated offline in Node: 425 tris for 220 pts, zero overlap,
         full coverage, Euler counts exact (scratchpad delaunay_test*).*/
      const det = (ax*ax+ay*ay)*(bx*cy-by*cx)
                - (bx*bx+by*by)*(ax*cy-ay*cx)
                + (cx*cx+cy*cy)*(ax*by-ay*bx);
      const orient = (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
      return orient > 0 ? det > 0 : det < 0;
    }

    for (let pi = 0; pi < n; pi++) {
      const [px,py] = pts[pi];
      const bad = [], edgeCount = new Map();
      for (let ti = 0; ti < tris.length; ti++) {
        if (circumscribes(ti, px, py)) {
          bad.push(ti);
          const t = tris[ti];
          const edges = [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]];
          for (const [a,b] of edges) {
            const key = Math.min(a,b)+','+ Math.max(a,b);
            edgeCount.set(key, (edgeCount.get(key)||0)+1);
          }
        }
      }
      /* Remove bad triangles */
      for (let i = bad.length-1; i >= 0; i--) tris.splice(bad[i], 1);
      /* Re-triangulate boundary */
      for (const [key, cnt] of edgeCount) {
        if (cnt === 1) {
          const [a,b] = key.split(',').map(Number);
          tris.push([a, b, pi]);
        }
      }
    }
    /* Remove triangles touching super-triangle vertices */
    return tris
      .filter(t => !t.some(i => i >= n))
      .map(t => [t[0], t[1], t[2]]);
  }

  /* ── Rasterise one morph triangle into output ImageData ──────────────
     dst[0..2]: destination triangle vertices [[x,y],…]
     src1/src2: corresponding source vertices in img A and img B         */
  function rasterizeMorphTri(od, d1, d2, W, H, dst, src1, src2, alfa) {
    const ia = 1 - alfa;
    /* Bounding box of destination triangle */
    const xs = dst.map(p=>p[0]), ys = dst.map(p=>p[1]);
    const x0=Math.max(0, Math.floor(Math.min(...xs)));
    const x1=Math.min(W-1, Math.ceil(Math.max(...xs)));
    const y0=Math.max(0, Math.floor(Math.min(...ys)));
    const y1=Math.min(H-1, Math.ceil(Math.max(...ys)));

    /* Precompute inverse of destination triangle matrix for barycentric */
    const [dv0,dv1,dv2] = dst;
    const T00=dv0[0]-dv2[0], T01=dv1[0]-dv2[0];
    const T10=dv0[1]-dv2[1], T11=dv1[1]-dv2[1];
    const det = T00*T11 - T01*T10;
    if (Math.abs(det) < 0.5) return;
    const idet = 1/det;

    function bilin(data, sx, sy) {
      const bx=sx|0, by=sy|0;
      const fx=sx-bx, fy=sy-by;
      const bx2=Math.min(bx+1,W-1), by2=Math.min(by+1,H-1);
      const wA=(1-fx)*(1-fy), wB=fx*(1-fy), wC=(1-fx)*fy, wD=fx*fy;
      const p00=(by*W+bx)*4, p10=(by*W+bx2)*4;
      const p01=(by2*W+bx)*4, p11=(by2*W+bx2)*4;
      return [
        data[p00]*wA+data[p10]*wB+data[p01]*wC+data[p11]*wD,
        data[p00+1]*wA+data[p10+1]*wB+data[p01+1]*wC+data[p11+1]*wD,
        data[p00+2]*wA+data[p10+2]*wB+data[p01+2]*wC+data[p11+2]*wD
      ];
    }

    for (let py = y0; py <= y1; py++) {
      for (let px = x0; px <= x1; px++) {
        /* Barycentric coords in destination triangle */
        const rx=px-dv2[0], ry=py-dv2[1];
        const l0=(T11*rx - T01*ry)*idet;
        const l1=(T00*ry - T10*rx)*idet;
        const l2=1-l0-l1;
        if (l0<-0.001||l1<-0.001||l2<-0.001) continue;

        /* Map to source triangles using same barycentric coords */
        const ax1=src1[0][0]*l0+src1[1][0]*l1+src1[2][0]*l2;
        const ay1=src1[0][1]*l0+src1[1][1]*l1+src1[2][1]*l2;
        const ax2=src2[0][0]*l0+src2[1][0]*l1+src2[2][0]*l2;
        const ay2=src2[0][1]*l0+src2[1][1]*l1+src2[2][1]*l2;

        const sx1c=Math.max(0,Math.min(W-1.001,ax1));
        const sy1c=Math.max(0,Math.min(H-1.001,ay1));
        const sx2c=Math.max(0,Math.min(W-1.001,ax2));
        const sy2c=Math.max(0,Math.min(H-1.001,ay2));

        const [r1,g1,b1] = bilin(d1, sx1c, sy1c);
        const [r2,g2,b2] = bilin(d2, sx2c, sy2c);

        const oi=(py*W+px)*4;
        od[oi  ] = r1*ia + r2*alfa;
        od[oi+1] = g1*ia + g2*alfa;
        od[oi+2] = b1*ia + b2*alfa;
        od[oi+3] = 255;
      }
    }
  }

  /* ── Main frame generator ─────────────────────────────────────────── */
  async function generateFrames() {
    const offA = document.createElement('canvas');
    const offB = document.createElement('canvas');
    offA.width = MW; offA.height = MH;
    offB.width = MW; offB.height = MH;
    const ctxA = offA.getContext('2d', { willReadFrequently: true });
    const ctxB = offB.getContext('2d', { willReadFrequently: true });

    const imgA = new Image(); imgA.src = S.images[0];
    const imgB = new Image(); imgB.src = S.images[1];
    let loaded = 0;

    await new Promise(resolve => {
      function onLoad() { if (++loaded >= 2) resolve(); }
      imgA.onload = imgB.onload = onLoad;
      if (imgA.complete) onLoad();
      if (imgB.complete) onLoad();
    });

    ctxA.drawImage(imgA, 0, 0, MW, MH);
    ctxB.drawImage(imgB, 0, 0, MW, MH);
    const idA = ctxA.getImageData(0, 0, MW, MH);
    const idB = ctxB.getImageData(0, 0, MW, MH);
    const d1 = idA.data, d2 = idB.data;
    const N = MW * MH;

    /* ── Try facial landmark detection first ───────────────────────
       DETECT ON LARGE CANVASES (fixed 2026-07-02): detection used to run
       on the 320×186 work canvases where faces are far too small for
       TinyFaceDetector — it silently failed and every face pair fell
       back to optical flow (≈ a crossfade, "still flips like the flip
       effect"). Detect at 640px with a bigger input size and a lower
       threshold, then scale the landmarks down to work-canvas coords.  */
    let pts1 = null, pts2 = null;
    /* AWAIT the shared model promise (15s cap) — checking a not-yet-set
       flag here is exactly the race that killed every face morph.      */
    const _fm = await Promise.race([
      ensureFaceModels(),
      new Promise(r => setTimeout(() => r({ ready: false, ssd: false, timedOut: true }), 15000))
    ]);
    if (_fm.timedOut) console.warn('[morph] face-api model load timed out — optical-flow fallback');
    if (_fm.ready && typeof faceapi !== 'undefined') {
      showProgress(5, 'Detecting facial landmarks…');
      await new Promise(r => setTimeout(r, 0));
      try {
        const DW = 640, DH = Math.round(DW * MH / MW);
        const mkDet = img => {
          const c = document.createElement('canvas'); c.width = DW; c.height = DH;
          c.getContext('2d').drawImage(img, 0, 0, DW, DH);
          return c;
        };
        const detCvsA = mkDet(imgA), detCvsB = mkDet(imgB);
        const detOne = async cvs => {
          if (_fm.ssd) {
            const d = await faceapi.detectSingleFace(cvs,
              new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks();
            if (d) return d;
          }
          return faceapi.detectSingleFace(cvs,
            new faceapi.TinyFaceDetectorOptions({ inputSize: 512, scoreThreshold: 0.2 })).withFaceLandmarks();
        };
        const [detA, detB] = await Promise.all([ detOne(detCvsA), detOne(detCvsB) ]);
        const hint = document.getElementById('previewHint');
        if (detA && detB) {
          const sx = MW / DW, sy = MH / DH;
          pts1 = detA.landmarks.positions.map(p => [p.x * sx, p.y * sy]);
          pts2 = detB.landmarks.positions.map(p => [p.x * sx, p.y * sy]);
          console.log('[morph] landmarks detected — using Delaunay face morph');
          if (hint) hint.textContent = 'Face morph: features aligned, morphing as the card tilts';
        } else {
          console.log('[morph] face not detected in one or both images — using optical flow');
          if (hint) hint.textContent = 'Object morph (no faces detected): works best with similar-shaped subjects';
        }
      } catch(e) { console.warn('[morph] landmark detection error:', e); }
    }

    if (pts1 && pts2) {
      /* ══ PATH A: Delaunay landmark morph (FantaMorph-quality) ════ */
      showProgress(15, 'Building Delaunay mesh…');
      await new Promise(r => setTimeout(r, 0));

      /* ── HYBRID FEATURE POINTS (2026-07-18, user request) ──────────
         The 68 landmarks cover ONLY the face, so hats / shoulders /
         background crossfaded as a static double-exposure (FantaMorph
         covers those areas with MANUALLY placed points). Add
         automatically-detected high-contrast points OUTSIDE the face
         hull, each given its image-B correspondence by the SAME
         pyramidal optical flow PATH B uses. Landmarks stay
         authoritative on the face: candidates inside either image's
         expanded face hull are rejected, so flow noise can never fight
         the landmark mesh. Flow is damped near the canvas border
         (boundary points are pinned) and outlier displacements are
         dropped (> max(25px, 3×median)) to avoid fold-over swirls.  */
      try {
        if (window.__noHybrid) throw new Error('hybrid disabled for debug');
        showProgress(8, 'Tracking background features…');
        let { u: flowU, v: flowV } = await computeMorphFlow();
        /* Same 3-pass 3×3 box blur PATH B applies before rendering —
           sampling the RAW field gave rogue correspondences (wiry
           streak triangles in textured areas like foliage).          */
        const blurN = (src) => {
          const dst = new Float32Array(N);
          for (let y = 1; y < MH-1; y++)
            for (let x = 1; x < MW-1; x++) {
              const i = y*MW + x;
              dst[i] = (src[i-MW-1]+src[i-MW]+src[i-MW+1]+
                        src[i-1]   +src[i]   +src[i+1]   +
                        src[i+MW-1]+src[i+MW]+src[i+MW+1]) / 9;
            }
          for (let x = 0; x < MW; x++) { dst[x] = src[x]; dst[(MH-1)*MW+x] = src[(MH-1)*MW+x]; }
          for (let y = 0; y < MH; y++) { dst[y*MW] = src[y*MW]; dst[y*MW+MW-1] = src[y*MW+MW-1]; }
          return dst;
        };
        flowU = blurN(blurN(blurN(flowU)));
        flowV = blurN(blurN(blurN(flowV)));

        /* convex hull of the landmarks, expanded ×1.12 about centroid */
        const hullOf = (pts) => {
          const s = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
          const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
          const lo = [], up = [];
          for (const p of s) { while (lo.length > 1 && cross(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
          for (let i = s.length - 1; i >= 0; i--) { const p = s[i]; while (up.length > 1 && cross(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
          const h = lo.slice(0, -1).concat(up.slice(0, -1));
          let cx = 0, cy = 0; for (const p of h) { cx += p[0]; cy += p[1]; } cx /= h.length; cy /= h.length;
          /* extra headroom ABOVE the brows: the 68-landmark scheme has
             no forehead points, so without this, flow points sit right
             above the eyes and their triangles smear into the face.  */
          return h.map(p => {
            const ex = cx + (p[0]-cx)*1.12;
            const ey = cy + (p[1]-cy)*(p[1] < cy ? 1.45 : 1.12);
            return [ex, ey];
          });
        };
        /* winding-agnostic convex point-in-polygon */
        const inHull = (h, x, y) => {
          let sgn = 0;
          for (let i = 0; i < h.length; i++) {
            const a = h[i], b = h[(i+1) % h.length];
            const c = (b[0]-a[0])*(y-a[1]) - (b[1]-a[1])*(x-a[0]);
            if (c !== 0) { const s = c > 0 ? 1 : -1; if (sgn === 0) sgn = s; else if (s !== sgn) return false; }
          }
          return true;
        };
        const hullA = hullOf(pts1), hullB = hullOf(pts2);

        /* strongest-gradient pixel per 16px grid cell of image A */
        const gA = new Float32Array(N);
        for (let i = 0; i < N; i++) { const p = i*4; gA[i] = (d1[p]*0.299 + d1[p+1]*0.587 + d1[p+2]*0.114) / 255; }
        const CELL = 16, GTH2 = 0.0064;   /* ≈ per-pixel gradient 0.04 */
        const cand = [];
        for (let cy0 = 0; cy0 < MH; cy0 += CELL)
          for (let cx0 = 0; cx0 < MW; cx0 += CELL) {
            let bg = 0, bx = -1, by = -1;
            const yEnd = Math.min(cy0 + CELL, MH - 2), xEnd = Math.min(cx0 + CELL, MW - 2);
            for (let y = Math.max(cy0, 2); y < yEnd; y++)
              for (let x = Math.max(cx0, 2); x < xEnd; x++) {
                const i = y*MW + x;
                const gx = gA[i+1] - gA[i-1], gy = gA[i+MW] - gA[i-MW];
                const g = gx*gx + gy*gy;
                if (g > bg) { bg = g; bx = x; by = y; }
              }
            if (bx >= 0 && bg > GTH2) cand.push([bx, by]);
          }

        /* ── Similarity transform of the FACE (Umeyama least squares over
           the 68 landmark pairs). Points NEAR the face must move WITH
           the head — a hat brim or collar whose optical flow disagrees
           with the landmark motion shears its triangles straight into
           the face (dark visor streak across the nose in testing).
           This is exactly what a FantaMorph operator does manually:
           hat/collar points follow the head, background points don't.
           Blend rigid-with-head → pure flow by distance from the face. */
        const LM = pts1.length;   /* landmarks only at this point */
        let mAx=0, mAy=0, mBx=0, mBy=0;
        for (let i = 0; i < LM; i++) { mAx+=pts1[i][0]; mAy+=pts1[i][1]; mBx+=pts2[i][0]; mBy+=pts2[i][1]; }
        mAx/=LM; mAy/=LM; mBx/=LM; mBy/=LM;
        let sxx=0, sa=0, sb=0;
        for (let i = 0; i < LM; i++) {
          const ax=pts1[i][0]-mAx, ay=pts1[i][1]-mAy;
          const bx=pts2[i][0]-mBx, by=pts2[i][1]-mBy;
          sxx += ax*ax + ay*ay;
          sa  += ax*bx + ay*by;
          sb  += ax*by - ay*bx;
        }
        const ka = sa/sxx, kb = sb/sxx;
        const simT = (x, y) => [ mBx + ka*(x-mAx) - kb*(y-mAy), mBy + kb*(x-mAx) + ka*(y-mAy) ];
        let faceR = 0;
        for (let i = 0; i < LM; i++) faceR = Math.max(faceR, Math.hypot(pts1[i][0]-mAx, pts1[i][1]-mAy));

        /* flow correspondence; damp near borders; reject outliers */
        const pre = [];
        for (const [x, y] of cand) {
          if (inHull(hullA, x, y)) continue;
          const i = y*MW + x;
          const damp = Math.min(1, Math.min(x, y, MW-1-x, MH-1-y) / 20);
          const dx = flowU[i]*damp, dy = flowV[i]*damp;
          pre.push([x, y, dx, dy, Math.hypot(dx, dy)]);
        }
        /* local-consistency: snap each point's flow to the median of its
           ≤45px neighbours when it disagrees by >12px — an isolated
           rogue correspondence shears hard-edged shards into the mesh
           (read as a phantom "extra hand" at the card edge, 2026-07-20).
           Regions that genuinely move together are unaffected: their
           neighbourhood median IS their own motion.                   */
        const fdx = new Float32Array(pre.length), fdy = new Float32Array(pre.length);
        for (let a = 0; a < pre.length; a++) {
          const nx = [], ny = [];
          for (let b = 0; b < pre.length; b++) {
            const ddx = pre[b][0]-pre[a][0], ddy = pre[b][1]-pre[a][1];
            if (ddx*ddx + ddy*ddy <= 45*45) { nx.push(pre[b][2]); ny.push(pre[b][3]); }
          }
          nx.sort((p, q) => p - q); ny.sort((p, q) => p - q);
          const mdx = nx[nx.length >> 1], mdy = ny[ny.length >> 1];
          const dev = Math.hypot(pre[a][2]-mdx, pre[a][3]-mdy);
          fdx[a] = dev > 12 ? mdx : pre[a][2];
          fdy[a] = dev > 12 ? mdy : pre[a][3];
        }
        const mags = pre.map((p, a) => Math.hypot(fdx[a], fdy[a])).sort((a, b) => a - b);
        const med = mags.length ? mags[mags.length >> 1] : 0;
        const CAP = Math.max(25, med * 3);
        let added = 0;
        for (let a = 0; a < pre.length; a++) {
          const [x, y] = pre[a];
          const dx = fdx[a], dy = fdy[a], m = Math.hypot(dx, dy);
          /* rigid-with-head weight: ≤1.2×faceR fully rigid, ≥2.8×faceR pure flow */
          const w = m > CAP ? 0
                  : Math.min(1, Math.max(0, (Math.hypot(x-mAx, y-mAy)/faceR - 1.2) / 1.6));
          const [rx, ry] = simT(x, y);
          const qx = Math.max(1, Math.min(MW - 2, rx*(1-w) + (x+dx)*w));
          const qy = Math.max(1, Math.min(MH - 2, ry*(1-w) + (y+dy)*w));
          if (inHull(hullB, qx, qy)) continue;
          pts1.push([x, y]); pts2.push([qx, qy]); added++;
        }
        console.log('[morph] hybrid: +' + added + ' flow-carried points outside the face');
      } catch(e) { console.warn('[morph] background flow failed — face-only morph:', e); }

      buildMeshFrames(pts1, pts2);

    } else {
      /* ══ PATH B: object morph — SHAPE MESH first (2026-07-20, user:
         "the cars do not line up"), pyramidal-flow fallback ══════════
         Dense brightness flow cannot find semantic correspondences
         between two DIFFERENT objects (car↔bike mid-frames were mush).
         FantaMorph's own car↔bike export is an outline-aligned mesh
         dissolve — so: segment the object from the background, sample
         its outline with rays from the centroid, and feed the SAME
         Delaunay mesh machinery PATH A uses. Flow remains the fallback
         when segmentation is untrustworthy (busy backgrounds).       */
      const shape = tryShapeMorph();
      if (shape) {
        console.log('[morph] shape morph: fg A ' + Math.round(shape.fa*100) +
                    '% B ' + Math.round(shape.fb*100) + '%');
        const hint = document.getElementById('previewHint');
        if (hint) hint.textContent = 'Object morph: outlines aligned, morphing as the card tilts';
        buildMeshFrames(shape.p1, shape.p2);
      } else {
        console.log('[morph] segmentation unsuitable — pyramidal optical flow');
        const { u, v } = await computeMorphFlow();
        buildFramesPhase(u, v);
      }
    }

    /* ── Shared mesh-morph frame builder (PATH A + shape PATH B) ─────
       Takes corresponding point sets in image A and B, appends the
       fixed canvas boundary/corner points, triangulates the midpoints
       and batch-renders all FRAMES+1 warped dissolve frames.         */
    function buildMeshFrames(pts1, pts2) {
      /* Boundary control points (same positions for both images) */
      const BN = 6;
      for (let i = 0; i <= BN; i++) {
        const tx = i/BN * MW, ty = i/BN * MH;
        pts1.push([tx,0],[tx,MH],[0,ty],[MW,ty]);
        pts2.push([tx,0],[tx,MH],[0,ty],[MW,ty]);
      }
      const corners = [[0,0],[MW,0],[MW,MH],[0,MH]];
      pts1.push(...corners); pts2.push(...corners);

      /* Delaunay on midpoints for consistent topology.
         Sub-pixel deterministic jitter (±0.3px) breaks the cocircular
         grid configurations that the hybrid's cell grid + boundary grid
         create — without it Bowyer-Watson's float circumcircle test
         produces an inconsistent mesh (thousands of overlapping slivers
         + black pinhole gaps). Jitter affects TOPOLOGY ONLY: per-frame
         geometry still interpolates the exact pts1/pts2 coordinates.  */
      const jit = i => ((((i * 2654435761) >>> 16) & 255) / 255 - 0.5) * 0.6;
      const midPts = pts1.map((p,i) => [
        (p[0]+pts2[i][0])/2 + jit(i), (p[1]+pts2[i][1])/2 + jit(i + 7919)
      ]);
      const tris = delaunay(midPts);
      console.log('[morph]', tris.length, 'triangles');

      showProgress(20, 'Rendering ' + tris.length + ' triangles × ' + (FRAMES+1) + ' frames…');

      const buildFrames = new Array(FRAMES + 1);
      let f = 0;

      function batchMesh() {
        const end = Math.min(f + 3, FRAMES + 1);
        for (; f < end; f++) {
          const alfa = f / FRAMES;
          const outId = workCtx.createImageData(MW, MH);
          const od    = outId.data;
          /* Fill with black first */
          for (let i = 3; i < od.length; i += 4) od[i] = 255;

          /* Midpoint mesh positions for this alpha */
          const ia = 1 - alfa;
          const mPts = pts1.map((p,i) => [
            p[0]*ia + pts2[i][0]*alfa,
            p[1]*ia + pts2[i][1]*alfa
          ]);

          for (const [i0,i1,i2] of tris) {
            rasterizeMorphTri(od, d1, d2, MW, MH,
              [mPts[i0], mPts[i1], mPts[i2]],
              [pts1[i0], pts1[i1], pts1[i2]],
              [pts2[i0], pts2[i1], pts2[i2]],
              alfa
            );
          }
          buildFrames[f] = outId;
        }
        showProgress(Math.round(20 + (f/(FRAMES+1))*80),
          'Mesh morph… ' + f + '/' + (FRAMES+1));
        if (f <= FRAMES) setTimeout(batchMesh, 0);
        else {
          morphFrames = buildFrames;
        }
      }
      setTimeout(batchMesh, 0);
    }

    /* ── Object segmentation: flood-fill background from the borders
       with LOCAL tolerance — smooth studio gradients (vignetted walls,
       plain backdrops) flood through, sharp object edges stop the
       flood. Foreground = largest component not reached. Validated
       offline on the car/bike reference pair (scratchpad proto_shape) */
    function segmentFg(d) {
      const bg = new Uint8Array(N);
      const qx = new Int32Array(N), qy = new Int32Array(N);
      let head = 0, tail = 0;
      const TOL = 14;   /* max per-channel step between neighbour bg px */
      const push = (x, y) => { const i = y*MW+x; if (!bg[i]) { bg[i] = 1; qx[tail]=x; qy[tail]=y; tail++; } };
      for (let x = 0; x < MW; x++) { push(x, 0); push(x, MH-1); }
      for (let y = 0; y < MH; y++) { push(0, y); push(MW-1, y); }
      while (head < tail) {
        const x = qx[head], y = qy[head]; head++;
        const p = (y*MW+x)*4;
        for (const [nx, ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]) {
          if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
          const j = ny*MW+nx;
          if (bg[j]) continue;
          const q = j*4;
          if (Math.abs(d[p]-d[q]) < TOL && Math.abs(d[p+1]-d[q+1]) < TOL &&
              Math.abs(d[p+2]-d[q+2]) < TOL) { bg[j] = 1; qx[tail]=nx; qy[tail]=ny; tail++; }
        }
      }
      let mask = new Uint8Array(N);
      for (let i = 0; i < N; i++) mask[i] = bg[i] ? 0 : 1;
      /* close small holes: dilate then erode */
      const morphOp = (m, want) => {
        const out = new Uint8Array(N);
        for (let y = 1; y < MH-1; y++)
          for (let x = 1; x < MW-1; x++) {
            const i = y*MW+x;
            const s2 = m[i-MW-1]+m[i-MW]+m[i-MW+1]+m[i-1]+m[i]+m[i+1]+m[i+MW-1]+m[i+MW]+m[i+MW+1];
            out[i] = want(s2) ? 1 : 0;
          }
        return out;
      };
      mask = morphOp(mask, s2 => s2 >= 1);
      mask = morphOp(mask, s2 => s2 >= 5);
      /* largest connected component */
      const lab = new Int32Array(N).fill(-1);
      let best = 0, bestId = -1, id = 0;
      for (let i = 0; i < N; i++) {
        if (!mask[i] || lab[i] >= 0) continue;
        let h2 = 0, t2 = 0, count = 0;
        qx[t2] = i % MW; qy[t2] = (i / MW) | 0; t2++;
        lab[i] = id;
        while (h2 < t2) {
          const x = qx[h2], y = qy[h2]; h2++; count++;
          for (const [nx, ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]) {
            if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
            const j = ny*MW+nx;
            if (mask[j] && lab[j] < 0) { lab[j] = id; qx[t2] = nx; qy[t2] = ny; t2++; }
          }
        }
        if (count > best) { best = count; bestId = id; }
        id++;
      }
      const fg = new Uint8Array(N);
      for (let i = 0; i < N; i++) fg[i] = lab[i] === bestId ? 1 : 0;
      return { fg, frac: best / N };
    }

    /* ── Outline points: centroid + 36 rays; per ray the farthest fg
       pixel (boundary) and its midpoint (interior stability). Point k
       in image A corresponds to point k in image B by construction. ── */
    function shapePoints(fg) {
      let cx = 0, cy = 0, n = 0;
      for (let y = 0; y < MH; y++)
        for (let x = 0; x < MW; x++)
          if (fg[y*MW+x]) { cx += x; cy += y; n++; }
      cx /= n; cy /= n;
      const RAYS = 36, pts = [[cx, cy]];
      for (let k = 0; k < RAYS; k++) {
        const th = k / RAYS * 2 * Math.PI;
        const dx = Math.cos(th), dy = Math.sin(th);
        let lastR = 0;
        for (let r = 1; r < Math.max(MW, MH) * 1.5; r++) {
          const x = Math.round(cx + dx*r), y = Math.round(cy + dy*r);
          if (x < 0 || y < 0 || x >= MW || y >= MH) break;
          if (fg[y*MW+x]) lastR = r;
        }
        if (lastR === 0) lastR = 2;
        pts.push([cx + dx*lastR, cy + dy*lastR]);
        pts.push([cx + dx*lastR*0.5, cy + dy*lastR*0.5]);
      }
      return pts;
    }

    /* Gate: both foregrounds must be a plausible single object or we
       fall back to optical flow (busy/outdoor backgrounds).          */
    function tryShapeMorph() {
      const A = segmentFg(d1), B = segmentFg(d2);
      const ok = r => r.frac >= 0.03 && r.frac <= 0.6;
      if (!ok(A) || !ok(B)) return null;
      return { p1: shapePoints(A.fg), p2: shapePoints(B.fg), fa: A.frac, fb: B.frac };
    }

    /* ── Shared pyramidal Horn-Schunck flow A→B ──────────────────────
       Used by PATH B for the whole morph, and by PATH A (2026-07-18) to
       give non-face feature points their correspondences. Function
       declaration — hoisted, callable from both branches above.       */
    async function computeMorphFlow() {
      /* ── Coarse-to-fine Horn-Schunck with iterative warping ────────
         (rebuilt 2026-07-17). The old SINGLE-SCALE HS at full res could
         only recover ~1-2px of motion, so for two DIFFERENT subjects
         (e.g. two cars) the flow came out ≈0 everywhere and the "morph"
         was just a crossfade — wheels never travelled. This version:
         1. Brute-force global min-SSD shift at the coarsest pyramid
            level (±8px there ≈ ±128px at full res) locks onto subjects
            that sit at different positions/sizes in the two photos.
         2. 5-level pyramid, each level warps A toward B by the current
            flow and HS solves only the residual → large displacements
            resolve coarse, detail refines fine.
         3. Grayscales are mean/std-normalised per level so different
            backgrounds/brightness can't kill the data term.
         Constants tuned OFFLINE against real image pairs (scratchpad
         flow_proto.py / flow_tune2.py, 2026-07-17): WARPS=3, ITERS=80,
         λ²=1.0 → a synthetic 18px shift is recovered exactly and the
         two-different-cars alignment improved 38%→53%. Do not retune
         blind in the browser.
         ────────────────────────────────────────────────────────────── */

      /* grayscale at full work res */
      const gray1 = new Float32Array(N);
      const gray2 = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        const p = i * 4;
        gray1[i] = (d1[p]*0.299 + d1[p+1]*0.587 + d1[p+2]*0.114) / 255;
        gray2[i] = (d2[p]*0.299 + d2[p+1]*0.587 + d2[p+2]*0.114) / 255;
      }

      const tick = () => new Promise(r => setTimeout(r, 0));

      const down2 = (src, w, h) => {
        const w2 = Math.floor(w / 2), h2 = Math.floor(h / 2);
        const dst = new Float32Array(w2 * h2);
        for (let y = 0; y < h2; y++) {
          const r0 = 2 * y * w, r1 = (2 * y + 1) * w;
          for (let x = 0; x < w2; x++) {
            const c = 2 * x;
            dst[y * w2 + x] = (src[r0 + c] + src[r0 + c + 1] + src[r1 + c] + src[r1 + c + 1]) * 0.25;
          }
        }
        return { d: dst, w: w2, h: h2 };
      };

      const normalizeImg = (src) => {
        let m = 0; for (let i = 0; i < src.length; i++) m += src[i]; m /= src.length;
        let s = 0; for (let i = 0; i < src.length; i++) { const d = src[i] - m; s += d * d; }
        s = Math.sqrt(s / src.length) || 1;
        const out = new Float32Array(src.length);
        for (let i = 0; i < src.length; i++) out[i] = (src[i] - m) / s;
        return out;
      };

      const bilinF = (src, w, h, x, y) => {
        x = x < 0 ? 0 : (x > w - 1.001 ? w - 1.001 : x);
        y = y < 0 ? 0 : (y > h - 1.001 ? h - 1.001 : y);
        const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
        const i = y0 * w + x0;
        return src[i] * (1 - fx) * (1 - fy) + src[i + 1] * fx * (1 - fy)
             + src[i + w] * (1 - fx) * fy   + src[i + w + 1] * fx * fy;
      };

      /* backward warp: sample g at (x − u, y − v) */
      const warpBack = (g, w, h, wu, wv) => {
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const i = y * w + x;
            out[i] = bilinF(g, w, h, x - wu[i], y - wv[i]);
          }
        return out;
      };

      /* bilinear flow upsample; values scaled by the resolution ratio */
      const upFlow = (src, sw, sh, dw, dh, scale) => {
        const out = new Float32Array(dw * dh);
        const rx = sw / dw, ry = sh / dh;
        for (let y = 0; y < dh; y++)
          for (let x = 0; x < dw; x++)
            out[y * dw + x] = bilinF(src, sw, sh, (x + 0.5) * rx - 0.5, (y + 0.5) * ry - 0.5) * scale;
        return out;
      };

      /* 3×3 box blur, edges copied */
      const blurFlow = (src, w, h) => {
        const dst = new Float32Array(src.length);
        for (let y = 1; y < h - 1; y++)
          for (let x = 1; x < w - 1; x++) {
            const i = y * w + x;
            dst[i] = (src[i-w-1] + src[i-w] + src[i-w+1] +
                      src[i-1]   + src[i]   + src[i+1]   +
                      src[i+w-1] + src[i+w] + src[i+w+1]) / 9;
          }
        for (let x = 0; x < w; x++) { dst[x] = src[x]; dst[(h-1)*w+x] = src[(h-1)*w+x]; }
        for (let y = 0; y < h; y++) { dst[y*w] = src[y*w]; dst[y*w+w-1] = src[y*w+w-1]; }
        return dst;
      };

      /* brute-force global min-SSD shift (coarsest level only) */
      const globalShift = (g1, g2, w, h, rng) => {
        let bx = 0, by = 0, bd = Infinity;
        for (let dy = -rng; dy <= rng; dy++)
          for (let dx = -rng; dx <= rng; dx++) {
            const x0 = Math.max(0, -dx), x1 = Math.min(w, w - dx);
            const y0 = Math.max(0, -dy), y1 = Math.min(h, h - dy);
            if (x1 - x0 < w / 2 || y1 - y0 < h / 2) continue;
            let s = 0, c = 0;
            for (let y = y0; y < y1; y++)
              for (let x = x0; x < x1; x++) {
                const d = g1[y * w + x] - g2[(y + dy) * w + (x + dx)];
                s += d * d; c++;
              }
            s /= c;
            if (s < bd) { bd = s; bx = dx; by = dy; }
          }
        return { dx: bx, dy: by };
      };

      /* incremental HS between (already-warped) g1w and g2 — Jacobi */
      const hsInc = (g1w, g2l, w, h, iters, lam2) => {
        const n = w * h;
        const Ix = new Float32Array(n), Iy = new Float32Array(n), It = new Float32Array(n);
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const i = y * w + x;
            if (x > 0 && x < w - 1) Ix[i] = (g1w[i+1] - g1w[i-1] + g2l[i+1] - g2l[i-1]) * 0.25;
            if (y > 0 && y < h - 1) Iy[i] = (g1w[i+w] - g1w[i-w] + g2l[i+w] - g2l[i-w]) * 0.25;
            It[i] = g2l[i] - g1w[i];
          }
        const du = new Float32Array(n), dv = new Float32Array(n);
        const duB = new Float32Array(n), dvB = new Float32Array(n);
        for (let it = 0; it < iters; it++) {
          for (let y = 0; y < h; y++)
            for (let x = 0; x < w; x++) {
              const i = y * w + x;
              let su = 0, sv = 0, c = 0;
              if (x > 0)     { su += du[i-1]; sv += dv[i-1]; c++; }
              if (x < w - 1) { su += du[i+1]; sv += dv[i+1]; c++; }
              if (y > 0)     { su += du[i-w]; sv += dv[i-w]; c++; }
              if (y < h - 1) { su += du[i+w]; sv += dv[i+w]; c++; }
              duB[i] = c ? su / c : 0; dvB[i] = c ? sv / c : 0;
            }
          for (let i = 0; i < n; i++) {
            const P = Ix[i] * duB[i] + Iy[i] * dvB[i] + It[i];
            const D = lam2 + Ix[i] * Ix[i] + Iy[i] * Iy[i];
            du[i] = duB[i] - Ix[i] * P / D;
            dv[i] = dvB[i] - Iy[i] * P / D;
          }
        }
        return { du, dv };
      };

      showProgress(5, 'Computing optical flow…');
      await tick();

      /* build pyramid: full res down to ~20px wide, max 5 levels */
      const levels = [{ d1: gray1, d2: gray2, w: MW, h: MH }];
      while (levels.length < 5 && Math.min(levels[levels.length-1].w, levels[levels.length-1].h) >= 24) {
        const L = levels[levels.length - 1];
        const a = down2(L.d1, L.w, L.h), b = down2(L.d2, L.w, L.h);
        levels.push({ d1: a.d, d2: b.d, w: a.w, h: a.h });
      }

      const WARPS = 3, ITERS = 80, LAM2 = 1.0;
      let u = null, v = null;
      for (let li = levels.length - 1; li >= 0; li--) {
        const L = levels[li];
        const g1 = normalizeImg(L.d1), g2l = normalizeImg(L.d2);
        if (li === levels.length - 1) {
          const { dx, dy } = globalShift(g1, g2l, L.w, L.h, 8);
          u = new Float32Array(L.w * L.h).fill(dx);
          v = new Float32Array(L.w * L.h).fill(dy);
        } else {
          const P = levels[li + 1];
          u = upFlow(u, P.w, P.h, L.w, L.h, L.w / P.w);
          v = upFlow(v, P.w, P.h, L.w, L.h, L.h / P.h);
        }
        for (let wi = 0; wi < WARPS; wi++) {
          const g1w = warpBack(g1, L.w, L.h, u, v);
          const { du, dv } = hsInc(g1w, g2l, L.w, L.h, ITERS, LAM2);
          for (let i = 0; i < u.length; i++) { u[i] += du[i]; v[i] += dv[i]; }
          u = blurFlow(u, L.w, L.h); v = blurFlow(v, L.w, L.h);
          showProgress(5 + Math.round(((levels.length - 1 - li) * WARPS + wi + 1)
                       / (levels.length * WARPS) * 15), 'Optical flow…');
          await tick();
        }
      }
      return { u, v };
    }

    /* smooth the flow, then build frames (PATH B only) */
    function buildFramesPhase(u, v) {
        /* 3×3 box blur × 3 passes — removes high-frequency flow noise
           while preserving large-scale warp structure */
        function boxBlur(src) {
          const dst = new Float32Array(N);
          for (let y = 1; y < MH-1; y++) {
            for (let x = 1; x < MW-1; x++) {
              const i = y*MW+x;
              dst[i] = (src[i-MW-1]+src[i-MW]+src[i-MW+1]+
                        src[i-1]   +src[i]   +src[i+1]   +
                        src[i+MW-1]+src[i+MW]+src[i+MW+1]) / 9;
            }
          }
          /* Copy edges from src so borders are not zero */
          for (let x = 0; x < MW; x++) { dst[x] = src[x]; dst[(MH-1)*MW+x] = src[(MH-1)*MW+x]; }
          for (let y = 0; y < MH; y++) { dst[y*MW] = src[y*MW]; dst[y*MW+MW-1] = src[y*MW+MW-1]; }
          return dst;
        }
        let su = boxBlur(boxBlur(boxBlur(u)));
        let sv = boxBlur(boxBlur(boxBlur(v)));

        showProgress(20, 'Building morph frames…');

        const buildFrames = new Array(FRAMES + 1);
        let f = 0;

        function batch() {
          const end = Math.min(f + 5, FRAMES + 1);
          for (; f < end; f++) {
            const alfa = f / FRAMES;   /* 0 = image A, 1 = image B */
            const ia   = 1 - alfa;
            const outId = workCtx.createImageData(MW, MH);
            const od    = outId.data;

            for (let py = 0; py < MH; py++) {
              for (let px = 0; px < MW; px++) {
                const i  = py * MW + px;
                const fu = su[i], fv = sv[i];

                /* Backward warp:
                   img A pixel that maps to output (px,py) came from (px - alfa·u, py - alfa·v)
                   img B pixel that maps to output (px,py) came from (px + ia·u,   py + ia·v)  */
                const sx1 = Math.max(0, Math.min(MW-1.001, px - alfa * fu));
                const sy1 = Math.max(0, Math.min(MH-1.001, py - alfa * fv));
                const sx2 = Math.max(0, Math.min(MW-1.001, px + ia   * fu));
                const sy2 = Math.max(0, Math.min(MH-1.001, py + ia   * fv));

                /* Bilinear sample — img A */
                const bx1=sx1|0, by1=sy1|0, fx1=sx1-bx1, fy1=sy1-by1;
                const p00=(by1*MW+bx1)*4;
                const wA=(1-fx1)*(1-fy1), wB=fx1*(1-fy1), wC=(1-fx1)*fy1, wD=fx1*fy1;
                const r1=d1[p00]*wA+d1[p00+4]*wB+d1[p00+MW*4]*wC+d1[p00+MW*4+4]*wD;
                const g1=d1[p00+1]*wA+d1[p00+5]*wB+d1[p00+MW*4+1]*wC+d1[p00+MW*4+5]*wD;
                const b1=d1[p00+2]*wA+d1[p00+6]*wB+d1[p00+MW*4+2]*wC+d1[p00+MW*4+6]*wD;

                /* Bilinear sample — img B */
                const bx2=sx2|0, by2=sy2|0, fx2=sx2-bx2, fy2=sy2-by2;
                const q00=(by2*MW+bx2)*4;
                const vA=(1-fx2)*(1-fy2), vB=fx2*(1-fy2), vC=(1-fx2)*fy2, vD=fx2*fy2;
                const r2=d2[q00]*vA+d2[q00+4]*vB+d2[q00+MW*4]*vC+d2[q00+MW*4+4]*vD;
                const g2=d2[q00+1]*vA+d2[q00+5]*vB+d2[q00+MW*4+1]*vC+d2[q00+MW*4+5]*vD;
                const b2=d2[q00+2]*vA+d2[q00+6]*vB+d2[q00+MW*4+2]*vC+d2[q00+MW*4+6]*vD;

                const oi = i * 4;
                od[oi  ] = r1*ia + r2*alfa;
                od[oi+1] = g1*ia + g2*alfa;
                od[oi+2] = b1*ia + b2*alfa;
                od[oi+3] = 255;
              }
            }
            buildFrames[f] = outId;
          }

          showProgress(
            Math.round(20 + (f / (FRAMES+1)) * 80),
            'Building frames… ' + f + ' / ' + (FRAMES+1)
          );

          if (f <= FRAMES) {
            setTimeout(batch, 0);
          } else {
            /* All frames complete — atomic assignment so draw() never sees partial array */
            morphFrames = buildFrames;
          }
        }
        setTimeout(batch, 0);
    }
  }

  setTimeout(generateFrames, 60);

  /* ── frameFn — morph progress scrubbed by the card's real tilt ──
     TRUE MORPH TIMING (fixed 2026-07-02): the morph sweeps GRADUALLY
     across the ENTIRE tilt range — tilt −1 = pure A, tilt +1 = pure B,
     every intermediate warped frame visible on the way (like a real
     lenticular morph print changing with viewing angle). The previous
     sigmoid centre-crossover zipped through the frames in a blink and
     looked identical to the flip — the user rejected it. Do NOT put a
     sigmoid back here; flip switches, morph sweeps.
     While frames generate, image A shows tracked to the card. */
  let paused = false, _morphT = 0;
  S.frameFn = (now, tilt) => {
    if (!morphFrames) return previewReady ? previewCvs : null;
    const rawT  = tiltSweepT(tilt);                  /* full-range sweep, normalised
                                                        to the video's real tilt span
                                                        (UD only reaches −0.63, so the
                                                        raw (t+1)/2 never hit pure A)  */
    const lensT = rawT * rawT * (3 - 2 * rawT);      /* gentle ends       */
    if (!paused) _morphT += (lensT - _morphT) * 0.15;
    const fi = Math.max(0, Math.min(FRAMES, Math.round(_morphT * FRAMES)));
    workCtx.putImageData(morphFrames[fi], 0, 0);
    return workCvs;
  };
  addCtrl('Pause', '⏸', () => { paused = !paused; }, false);
}

/* ═══════════════════════════════════════════════════════════════
   RENDER: 3D Parallax (left-right only)
   ═══════════════════════════════════════════════════════════════ */
function renderThreed(cc) {
  cc.classList.remove('card-tilting', 'card-tilting-ud');

  /* Depth-map parallax, same engine as Layered 3D.
     If the AI depth map isn't ready yet, render with a flat mid-grey
     depth (image shows immediately, tracked to the card, no parallax)
     and swap in the real depth map the moment generation finishes.   */
  if (S.depthMaps[0]) {
    renderDepthMap3d(cc);
    return;
  }

  const flat = document.createElement('canvas');
  flat.width = 8; flat.height = 8;
  const fx = flat.getContext('2d');
  fx.fillStyle = '#808080'; fx.fillRect(0, 0, 8, 8);
  renderDepthMap3d(cc, flat.toDataURL());

  generateDepthMap(S.images[0]).then(d => {
    if (!d) return;
    S.depthMaps[0] = d;
    if (EFFECTS[S.effectIdx].id === 'threed') generatePreview();
  });
}

/* ═══════════════════════════════════════════════════════════════
   RENDER: Layered 3D — depth-map driven per-pixel parallax
   ─────────────────────────────────────────────────────────────
   If S.depthMaps[0] is set: uses per-pixel displacement based
   on the depth map. Each pixel shifts horizontally by:
     shift = tiltX × depthNorm × MAX_PARALLAX_PX
   where depthNorm = depthPixel/255 (white=near=shifts most).

   Falls back to the old PSD-layer CSS parallax if no depth map.
   ═══════════════════════════════════════════════════════════════ */
function renderLayered3d(cc) {
  cc.innerHTML = '';

  /* TRUE layered 3D (rebuilt 2026-07-02, user requirement): needs a PSD
     with each element on its own layer. Layers are depth planes drawn
     back-to-front; each plane shifts horizontally with the card tilt at
     a rate set by its depth — background one way, foreground the other,
     the middle plane stable. This is how a real layered lenticular
     (Triaxes-style) reads. NOT a depth-map effect — that's the 3D tab. */
  const layers = S.psdLayers[0];
  const { CW, CH } = cardSrcDims();
  const work = document.createElement('canvas'); work.width = CW; work.height = CH;
  const wctx = work.getContext('2d');

  if (!layers || layers.length < 2) {
    /* Flat image / single-layer PSD: show it tracked, tell the user why
       there's no depth. Do not fake it with a depth map.               */
    const hint = document.getElementById('previewHint');
    if (hint) hint.textContent =
      'Layered 3D needs a PSD with each element on its own layer. This file has only one layer, so it shows flat.';
    let imgEl = null;
    if (S.images[0]) { const i = new Image(); i.onload = () => { imgEl = i; }; i.src = S.images[0]; }
    S.frameFn = () => {
      if (!imgEl) return null;
      wctx.clearRect(0, 0, CW, CH);
      drawCover(wctx, imgEl, CW, CH);
      return work;
    };
    return;
  }

  /* Load every layer at card size (same cover crop → planes stay aligned). */
  const planes = layers.map(() => null);
  layers.forEach((src, i) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = CW; c.height = CH;
      drawCover(c.getContext('2d'), img, CW, CH);
      planes[i] = c;
    };
    img.src = src;
  });

  const MAX_SEP = 48;          /* px between farthest and nearest plane at full tilt
                                  (34 read too subtle — user 2026-07-02)            */
  const OVERSCAN = 1.14;       /* covers the gap a shifted background would reveal   */
  let curShift = 0, paused = false;
  S.frameFn = (now, tilt) => {
    if (!planes[0]) return null;
    const N = planes.length;
    const isUD = S.orientation === 'ud';
    const t = Math.max(-1, Math.min(1, tilt * 0.85 + (isUD ? S.mouseY : S.mouseX) * 0.3));
    if (!paused) curShift += (t * MAX_SEP - curShift) * 0.15;
    wctx.clearRect(0, 0, CW, CH);
    for (let i = 0; i < N; i++) {
      const p = planes[i];
      if (!p) continue;
      const depth = i / (N - 1) - 0.5;        /* −0.5 back … +0.5 front */
      const d = curShift * depth;
      /* near planes also scale up a touch as they pop — stronger 3D read */
      const sc = OVERSCAN * (1 + depth * 0.04 * Math.abs(curShift) / MAX_SEP);
      wctx.save();
      wctx.translate(CW / 2 + (isUD ? 0 : d), CH / 2 + (isUD ? d : 0));
      wctx.scale(sc, sc);
      wctx.drawImage(p, -CW / 2, -CH / 2);
      wctx.restore();
    }
    return work;
  };
  addCtrl('Pause', '⏸', () => { paused = !paused; }, false);
}

/* ── Depth-map parallax (WebGL) — GPU per-pixel parallax ─────────────────
   GPU upgrade of the old CPU single-tap map. A fragment shader solves the
   backward parallax sample by fixed-point iteration:
       uv' = uv − P · height(uv')   (near = white = height 1 → shifts most)
   8 refinement taps resolve occlusion at depth edges (no smearing) and the
   sample is bilinear at full 640×363, so silhouettes stay crisp where the
   1-tap nearest CPU map smeared. Output is warped onto the tracked quad by
   the unified compositor, exactly like every other effect, so the parallax
   stays locked to the placeholder. Falls back to the CPU map if a browser
   has no WebGL.                                                            */

let _glDepth = null;   /* singleton GL renderer — reused so we never leak contexts */

function _initGLDepth() {
  if (_glDepth !== null) return _glDepth || null;   /* null = tried & failed */
  const cvs = document.createElement('canvas');
  cvs.width = 640; cvs.height = 363;
  const opts = { preserveDrawingBuffer: true, alpha: true, premultipliedAlpha: false, antialias: true };
  const gl = cvs.getContext('webgl', opts) || cvs.getContext('experimental-webgl', opts);
  if (!gl) { _glDepth = false; return null; }

  const vsSrc = 'attribute vec2 aPos; varying vec2 vUv;' +
    'void main(){ vUv = aPos*0.5 + 0.5; gl_Position = vec4(aPos,0.0,1.0); }';
  const fsSrc = [
    'precision highp float;',
    'varying vec2 vUv;',
    'uniform sampler2D uImg;',
    'uniform sampler2D uDepth;',
    'uniform vec2 uShift;',                  /* parallax offset in uv units */
    'uniform float uInset;',                 /* 1 − 2·HEIGHT: keeps samples inside the image */
    'const int N = 12;',
    'void main(){',
    /* Inset the base UV so no shifted sample can leave the image — this is
       what removes the smeared/stretched EDGES in the corners at full tilt
       (CLAMP_TO_EDGE used to repeat the border pixels there).             */
    '  vec2 base = 0.5 + (vUv - 0.5) * uInset;',
    /* CENTRED depth parallax (user-confirmed 2026-07-02: BOTH move):
       the card plane sits at MID depth. Foreground (near, h=1) shifts
       +0.5·shift — comes OUT in 3D space — while the background (far,
       h=0) shifts −0.5·shift — pushed BACK. Equal counter-motion around
       the card plane (verified: interior markers +21px / −21.5px).
       Solved by DAMPED fixed-point iteration of
       uv = base − (h(uv) − 0.5)·shift; the heavily blurred depth map
       keeps the iteration convergent (do not remove blur or damping). */
    '  vec2 uv = base;',
    '  for(int i=0;i<N;i++){',
    '    float h = texture2D(uDepth, uv).r;',      /* 1 = near */
    '    vec2 target = base - (h - 0.5) * uShift;',
    '    uv = mix(uv, target, 0.6);',              /* damping: stable at ramps */
    '  }',
    '  gl_FragColor = texture2D(uImg, uv);',
    '}'
  ].join('\n');

  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('[glDepth] shader', gl.getShaderInfoLog(s)); return null;
    }
    return s;
  };
  const vsh = sh(gl.VERTEX_SHADER, vsSrc), fsh = sh(gl.FRAGMENT_SHADER, fsSrc);
  if (!vsh || !fsh) { _glDepth = false; return null; }
  const prog = gl.createProgram();
  gl.attachShader(prog, vsh); gl.attachShader(prog, fsh); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('[glDepth] link', gl.getProgramInfoLog(prog)); _glDepth = false; return null;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);   /* keep the image upright */
  const mkTex = () => {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return t;
  };
  const texImg = mkTex(), texDep = mkTex();
  gl.uniform1i(gl.getUniformLocation(prog, 'uImg'), 0);
  gl.uniform1i(gl.getUniformLocation(prog, 'uDepth'), 1);

  _glDepth = {
    cvs, gl, prog,
    uShift: gl.getUniformLocation(prog, 'uShift'),
    uInset: gl.getUniformLocation(prog, 'uInset'),
    texImg, texDep
  };
  return _glDepth;
}

function renderDepthMap3d(cc, depthSrc) {
  depthSrc = depthSrc || S.depthMaps[0];
  cc.innerHTML = '';

  const G = _initGLDepth();
  if (!G) { renderDepthMap3dCPU(cc, depthSrc); return; }   /* no WebGL → CPU */
  const gl = G.gl;
  const { CW, CH } = cardSrcDims();
  /* resize the singleton GL canvas to match the card aspect (portrait) */
  if (G.cvs.width !== CW)  G.cvs.width  = CW;
  if (G.cvs.height !== CH) G.cvs.height = CH;

  let ready = false;
  (async () => {
    const loadImg = src => new Promise(res => {
      const img = new Image(); img.onload = () => res(img); img.src = src;
      if (img.complete) res(img);
    });
    const [img, dmap] = await Promise.all([ loadImg(S.images[0]), loadImg(depthSrc) ]);
    const ic = document.createElement('canvas'); ic.width = CW; ic.height = CH;
    drawCover(ic.getContext('2d'), img, CW, CH);
    /* Depth remap (2026-07-17, user: "fg needs better 3D, bg pushed further
       back, currently looks stretched"): the AI depth maps cluster around
       mid-grey, so the warp was using only ~half the available parallax and
       the big smooth mid-ramps read as rubbery stretching rather than a
       subject popping out. Fix: (1) normalise to the map's real 2%..98%
       range, (2) push values through a double-smoothstep S-curve so the
       background lands near 0 (full push-back) and the subject near 1
       (full pop-out) with a steep but still smooth ramp between — closer
       to the two-plane look a real layered lenticular has.               */
    const dc0 = document.createElement('canvas'); dc0.width = CW; dc0.height = CH;
    const d0 = dc0.getContext('2d', { willReadFrequently: true });
    drawCover(d0, dmap, CW, CH);
    const did = d0.getImageData(0, 0, CW, CH);
    const dpx = did.data;
    const hist = new Uint32Array(256);
    for (let i = 0; i < dpx.length; i += 4) hist[dpx[i]]++;
    const nPix = dpx.length / 4;
    let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= nPix * 0.02) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= nPix * 0.02) { hi = v; break; } }
    const span = Math.max(1, hi - lo);
    const lut = new Uint8ClampedArray(256);
    for (let v = 0; v < 256; v++) {
      let t = (v - lo) / span; t = t < 0 ? 0 : t > 1 ? 1 : t;
      t = t * t * (3 - 2 * t);          /* smoothstep twice = strong but   */
      t = t * t * (3 - 2 * t);          /* smooth fg/bg separation         */
      lut[v] = Math.round(t * 255);
    }
    for (let i = 0; i < dpx.length; i += 4) {
      const v = lut[dpx[i]];
      dpx[i] = dpx[i+1] = dpx[i+2] = v;
    }
    d0.putImageData(did, 0, 0);
    /* Then HEAVILY blur the remapped map. The blur radius must exceed the
       max per-side pixel displacement (24px at HEIGHT 0.075 × 640), or the
       fixed-point solve oscillates at silhouette edges and PINS them in
       place (weak "content-slide" 3D plus smearing streaks). Do NOT reduce
       below ~26px while HEIGHT is 0.075.                                  */
    const dc = document.createElement('canvas'); dc.width = CW; dc.height = CH;
    const dctx = dc.getContext('2d');
    dctx.filter = 'blur(34px)';
    dctx.drawImage(dc0, 0, 0);
    dctx.filter = 'none';
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, G.texImg);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ic);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, G.texDep);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, dc);
    ready = true;
  })();

  const HEIGHT = 0.075;           /* max parallax as a fraction of card width.
                                     0.05 read too subtle (user 2026-07-17:
                                     "fg out, bg further back"); 0.075 works
                                     because the centred warp splits it ±half
                                     (24px per side at 640) and the 34px depth
                                     blur still exceeds that — no smearing    */
  let curX = 0, curY = 0, paused = false;
  S.frameFn = (now, tilt) => {
    if (!ready) return null;
    /* the card's rock drives the parallax along its own axis:
       LR video → horizontal, UD video → vertical (mouse adds the other) */
    const isUD = S.orientation === 'ud';
    const tx = Math.max(-1, Math.min(1, (isUD ? 0 : tilt * 0.85) + S.mouseX * 0.3));
    const ty = Math.max(-1, Math.min(1, (isUD ? tilt * 0.85 : 0) + S.mouseY * 0.5));
    if (!paused) { curX += (tx - curX) * 0.15; curY += (ty - curY) * 0.15; }
    gl.useProgram(G.prog);
    gl.uniform2f(G.uShift, curX * HEIGHT, curY * HEIGHT);
    gl.uniform1f(G.uInset, 1.0 - 2.0 * HEIGHT);   /* march + centring headroom:
                                                     max excursion is 0.5·HEIGHT,
                                                     margin is HEIGHT per side =
                                                     2× headroom. (2.0 not 3.0 so
                                                     the visible field stays the
                                                     same 0.85 as before the
                                                     HEIGHT increase.)          */
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, G.texImg);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, G.texDep);
    gl.viewport(0, 0, CW, CH);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    return G.cvs;
  };
  addCtrl('Pause', '⏸', () => { paused = !paused; }, false);
}

/* CPU fallback — original 1-tap backward map (used only when WebGL absent). */
function renderDepthMap3dCPU(cc, depthSrc) {
  depthSrc = depthSrc || S.depthMaps[0];
  cc.innerHTML = '';

  const { CW: _dW, CH: _dH } = cardSrcDims();
  const MW = Math.round(_dW / 2), MH = Math.round(_dH / 2);
  const workCvs = document.createElement('canvas');
  workCvs.width = MW; workCvs.height = MH;
  const workCtx = workCvs.getContext('2d');
  const MAX_SHIFT = 22;

  let imgData = null, depthData = null, assetsReady = false;
  (async () => {
    const loadImg = src => new Promise(res => {
      const img = new Image(); img.onload = () => res(img); img.src = src;
      if (img.complete) res(img);
    });
    const [img, dmap] = await Promise.all([ loadImg(S.images[0]), loadImg(depthSrc) ]);
    const ta = document.createElement('canvas'); ta.width=MW; ta.height=MH;
    const ca = ta.getContext('2d', { willReadFrequently: true });
    drawCover(ca, img, MW, MH);
    imgData = ca.getImageData(0, 0, MW, MH);
    const td = document.createElement('canvas'); td.width=MW; td.height=MH;
    const cd = td.getContext('2d', { willReadFrequently: true });
    cd.drawImage(dmap, 0, 0, MW, MH);
    depthData = cd.getImageData(0, 0, MW, MH);
    assetsReady = true;
  })();

  let curShift = 0, paused = false;
  S.frameFn = (now, tilt) => {
    if (!assetsReady) return null;
    const tiltX = Math.max(-1, Math.min(1, tilt * 0.85 + S.mouseX * 0.3));
    if (!paused) curShift += (tiltX * MAX_SHIFT - curShift) * 0.15;
    const out = workCtx.createImageData(MW, MH);
    const od = out.data, sd = imgData.data, dd = depthData.data;
    for (let y = 0; y < MH; y++) {
      for (let x = 0; x < MW; x++) {
        const i   = (y * MW + x) * 4;
        const dep = dd[i] / 255;                       /* 0=far, 1=near */
        const sx  = Math.max(0, Math.min(MW - 1, (x - curShift * dep + 0.5) | 0));
        const si  = (y * MW + sx) * 4;
        od[i] = sd[si]; od[i+1] = sd[si+1]; od[i+2] = sd[si+2]; od[i+3] = 255;
      }
    }
    workCtx.putImageData(out, 0, 0);
    return workCvs;
  };
  addCtrl('Pause', '⏸', () => { paused = !paused; }, false);
}

/* ═══════════════════════════════════════════════════════════════
   RENDER: Animation — PSD layers scrub with the card tilt
   ═══════════════════════════════════════════════════════════════ */
function renderAnimation(cc) {
  cc.innerHTML = '';
  const layers = (S.psdLayers[0] && S.psdLayers[0].length > 1) ? S.psdLayers[0] : [S.images[0]];
  const { CW, CH } = cardSrcDims();

  const frames = layers.map(() => null);
  layers.forEach((src, i) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = CW; c.height = CH;
      drawCover(c.getContext('2d'), img, CW, CH);
      frames[i] = c;
    };
    img.src = src;
  });

  let _fi = 0, paused = false;
  S.frameFn = (now, tilt) => {
    const N = frames.length;
    if (N === 0 || !frames[0]) return null;
    const rawT  = (tilt + 1) / 2;
    const lensT = rawT * rawT * (3 - 2 * rawT);
    if (!paused) _fi += (lensT * (N - 1) - _fi) * 0.15;
    const fi = Math.max(0, Math.min(N - 1, Math.round(_fi)));
    return frames[fi] || frames[0];
  };
  addCtrl('Pause', '⏸', () => { paused = !paused; }, false);
}

/* ═══════════════════════════════════════════════════════════════
   RENDER: Zoom — zoom level follows the viewing angle
   ─────────────────────────────────────────────────────────────
   Professional zoom PSDs (verified against TwenT3's PSD FILES
   library 2026-07-02, e.g. "Zoom truck", "Camera Zoom") contain
   ~12 pre-rendered layers — the SAME artwork at progressive zoom
   steps, focal element growing while the background holds. So a
   multi-layer PSD is scrubbed layer-by-layer with the tilt, just
   like the pros built it. A plain image falls back to a simple
   programmatic whole-image zoom.
   ═══════════════════════════════════════════════════════════════ */
function renderZoom(cc) {
  cc.innerHTML = '';
  const { CW, CH } = cardSrcDims();
  const work = document.createElement('canvas'); work.width = CW; work.height = CH;
  const wctx = work.getContext('2d');

  const layers = S.psdLayers[0];
  if (layers && layers.length > 1) {
    /* PSD route: scrub the pre-rendered zoom steps with the tilt */
    const frames = layers.map(() => null);
    layers.forEach((src, i) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = CW; c.height = CH;
        drawCover(c.getContext('2d'), img, CW, CH);
        frames[i] = c;
      };
      img.src = src;
    });
    let _fi = 0, paused = false;
    S.frameFn = (now, tilt) => {
      const N = frames.length;
      if (!frames[0]) return null;
      const rawT  = (tilt + 1) / 2;
      const lensT = rawT * rawT * (3 - 2 * rawT);
      if (!paused) _fi += (lensT * (N - 1) - _fi) * 0.15;
      const fi = Math.max(0, Math.min(N - 1, Math.round(_fi)));
      return frames[fi] || frames[0];
    };
    addCtrl('Pause', '⏸', () => { paused = !paused; }, false);
    return;
  }

  /* Single image route: programmatic whole-image zoom */
  let imgEl = null;
  { const i = new Image(); i.onload = () => { imgEl = i; }; i.src = S.images[0]; }

  let _zoom = 1, paused = false;
  S.frameFn = (now, tilt) => {
    if (!imgEl) return null;
    const target = 1 + 0.35 * (tilt + 1) / 2;   /* 1.0 → 1.35 across the rock */
    if (!paused) _zoom += (target - _zoom) * 0.12;
    wctx.clearRect(0, 0, CW, CH);
    wctx.save();
    wctx.translate(CW / 2, CH / 2);
    wctx.scale(_zoom, _zoom);
    wctx.translate(-CW / 2, -CH / 2);
    drawCover(wctx, imgEl, CW, CH);
    wctx.restore();
    return work;
  };
  addCtrl('Pause', '⏸', () => { paused = !paused; }, false);
}

/* ═══════════════════════════════════════════════════════════════
   RENDER: Stereoscopic — red-cyan anaglyph, tracked to the card
   ═══════════════════════════════════════════════════════════════ */
function renderStereoscopic(cc) {
  cc.innerHTML = '';

  /* TRUE lenticular stereo pair (corrected 2026-07-02, user spec):
     NO glasses, NO anaglyph. Image 1 = left view, Image 2 = right view,
     shot slightly offset. On the real lenticular print each viewing
     angle shows one of the views — so here the card tilt sweeps between
     the two views across the rock. The motion parallax between the
     offset views is what reads as 3D, exactly like the physical card. */
  const { CW, CH } = cardSrcDims();
  const offL = document.createElement('canvas'); offL.width = CW; offL.height = CH;
  const offR = document.createElement('canvas'); offR.width = CW; offR.height = CH;
  const work = document.createElement('canvas'); work.width = CW; work.height = CH;
  const wctx = work.getContext('2d');
  let ready = false;

  (async () => {
    const loadImg = src => new Promise(res => {
      const img = new Image(); img.onload = () => res(img); img.src = src;
      if (img.complete) res(img);
    });
    const [imgL, imgR] = await Promise.all([ loadImg(S.images[0]), loadImg(S.images[1]) ]);
    drawCover(offL.getContext('2d'), imgL, CW, CH);
    drawCover(offR.getContext('2d'), imgR, CW, CH);
    ready = true;
  })();

  let _t = 0.5, paused = false;
  S.frameFn = (now, tilt) => {
    if (!ready) return null;
    /* tilt −1 = pure left view, +1 = pure right view, smooth sweep */
    const rawT  = (tilt + 1) / 2;
    const lensT = rawT * rawT * (3 - 2 * rawT);
    if (!paused) _t += (lensT - _t) * 0.2;
    const a = Math.max(0, Math.min(1, _t));
    /* TRUE cross-dissolve, same fix as renderFlip (2026-07-25): fade the LEFT
       view out as the right fades in. Drawing L at alpha 1 and only fading R
       on top leaves L permanently visible wherever R is TRANSPARENT. */
    wctx.clearRect(0, 0, CW, CH);
    if (a < 0.998) { wctx.globalAlpha = 1 - a; wctx.drawImage(offL, 0, 0); }
    if (a > 0.002) { wctx.globalAlpha = a;     wctx.drawImage(offR, 0, 0); }
    wctx.globalAlpha = 1;
    return work;
  };
  addCtrl('Pause', '⏸', () => { paused = !paused; }, false);
}

/* ═══════════════════════════════════════════════════════════════
   FILE HANDLING
   ═══════════════════════════════════════════════════════════════ */
async function handleFile(file, idx) {
  if (!file) return;
  const zone = document.getElementById('zone' + idx);
  if (zone) zone.style.opacity = '.5';

  /* Big library PSDs run to 130+ MB and take several seconds to parse —
     show progress so it doesn't read as "not loading" (user 2026-07-02). */
  const zoneLbl = zone ? zone.querySelector('.upload-label-text') : null;
  const zoneLblOld = zoneLbl ? zoneLbl.innerHTML : '';
  const isPsd = file.name.toLowerCase().endsWith('.psd');
  if (zoneLbl && isPsd) zoneLbl.innerHTML =
    '<strong>Parsing PSD…</strong> (' + Math.max(1, Math.round(file.size/1048576)) + ' MB, a few seconds)';

  const psdResult = await parsePSD(file);
  if (zoneLbl) zoneLbl.innerHTML = zoneLblOld;
  if (psdResult) {
    S.images[idx]    = psdResult.flat;
    S.psdLayers[idx] = psdResult.layers;
  } else if (file.type.startsWith('image/') || !file.name.toLowerCase().endsWith('.psd')) {
    await new Promise(res => {
      const r = new FileReader();
      r.onload = ev => {
        S.images[idx]    = ev.target.result;
        S.psdLayers[idx] = [ev.target.result];
        res();
      };
      r.readAsDataURL(file);
    });
  } else if (typeof AgPsd === 'undefined') {
    alert('The PSD reader failed to load with the page. Refresh the page (Ctrl+F5) and try again.');
  } else {
    alert('This PSD could not be read (it may use a feature the reader does not support). ' +
          'Try re-saving it in Photoshop with Maximize Compatibility on, or upload a PNG/JPG.');
  }

  if (zone) zone.style.opacity = '1';
  /* ── Two-slot PSD auto-split (2026-07-02) ────────────────────────────
     Professional 2-image PSDs hold both images as two layers in ONE file
     (verified in the TwenT3 library: flip PSDs = image A + image B,
     "Stereoscopic 3D for website.psd" = left view + right view). For any
     two-image effect (flip, morph, stereoscopic), dropping such a PSD on
     either slot fills BOTH slots from its first two layers.            */
  const curEff = EFFECTS[S.effectIdx];
  if (curEff.numImages === 2 &&
      S.psdLayers[idx] && S.psdLayers[idx].length >= 2) {
    S.images[0]    = S.psdLayers[idx][0];
    S.images[1]    = S.psdLayers[idx][1];
    S.psdLayers[0] = [S.images[0]];
    S.psdLayers[1] = [S.images[1]];
  }

  /* Auto-select Portrait fit when the first upload is a portrait image
     (taller than wide) so customers see the whole photo un-cropped.    */
  if (idx === 0 && S.images[0]) {
    try {
      const probe = new Image();
      probe.onload = () => {
        const fit = probe.naturalHeight > probe.naturalWidth ? 'portrait' : 'landscape';
        if (fit !== S.cardFit) {
          S.cardFit = fit;
          document.querySelectorAll('#fitBar .orient-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.fit === fit));
        }
      };
      probe.src = S.images[0];
    } catch (e) {}
  }

  updateThumbs();
  checkReady();

  /* ── Auto-generate depth map for 3D ──────────────────────────────────
     As soon as the customer uploads their image we kick off AI depth
     estimation in the background.  No button click needed.             */
  if (curEff.id === 'threed' &&
      idx === 0 && S.images[0] && !S.depthMaps[0]) {
    _autoDepth();
  }
}

function updateThumbs() {
  const row = document.getElementById('thumbRow');
  if (!row) return;
  row.innerHTML = '';
  S.images.forEach((src, i) => {
    if (!src) return;
    const d = document.createElement('div');
    d.className = 'thumb';
    const lc = (S.psdLayers[i] || []).length;
    const badge = lc > 1 ? `<div style="position:absolute;bottom:2px;left:2px;background:var(--green);color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;">${lc}L</div>` : '';
    d.innerHTML = `<img src="${src}"/><button class="rm">✕</button>${badge}`;
    d.querySelector('.rm').onclick = () => { S.images[i]=null; S.psdLayers[i]=[]; updateThumbs(); checkReady(); };
    row.appendChild(d);
  });
}

function checkReady() {
  const eff = EFFECTS[S.effectIdx];
  const btn = document.getElementById('btnGenerate');
  if (btn) {
    if (eff.id === 'sequence') {
      btn.disabled = S.seqFrames.length === 0;
    } else {
      btn.disabled = S.images.filter(Boolean).length < eff.numImages;
    }
  }
  /* Enable depth-gen button when image 0 is ready */
  const depthBtn = document.getElementById('btnDepthGen');
  if (depthBtn) depthBtn.disabled = !S.images[0];
}

/* ── Auto depth — runs silently in the background after image upload ── */
async function _autoDepth() {
  const status = document.getElementById('depthStatus');
  const btn    = document.getElementById('btnDepthGen');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Generating…'; }
  if (status) { status.className = 'depth-status'; status.textContent = 'Auto-generating depth map…'; }

  const result = await generateDepthMap(S.images[0]);
  if (result) {
    S.depthMaps[0] = result;
    setDepthMapUI(result);
    if (status) { status.className = 'depth-status ok'; status.textContent = '✓ Depth map ready'; }
  } else {
    if (status) { status.className = 'depth-status'; status.textContent = 'Auto depth failed — upload a depth map or retry'; }
  }
  if (btn) { btn.disabled = !S.images[0]; btn.textContent = '🤖 AI Generate Depth'; }
  checkReady();
}

/* alias used in depth section */
function updateGenerateBtn() { checkReady(); }
